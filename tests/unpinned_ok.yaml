# read, but cannot change any result
"parameters/baseline_2026/social_insurance.yaml: student_deferral.working_student_deduction": "the engine takes it off only when total income is at most 890,000 (the working-student limit), and income after it is then always far below the 1,280,000 deferral limit, so it can never decide the test"
"parameters/designs/daiwa.yaml: parameters.income_tax_basic_deduction": "the plan sets it to 0; the check moves it to 1 yen, and the credit (1,780,000 − 740,000 − this) × 5% rounds back to the same 52,000, which test_daiwa_credit_formula pins"

