assumptions:
  - {ja: "学生本人だけを計算しています（この例の「世帯」は学生本人だけです）。親は別の世帯として扱うため、学生を養うことで親の税金が安くなる分（扶養控除など）は含まれません。学生の年収が増えると、親のこの控除が減ったりなくなったりします。2026年の収入では、学生の給与が136万円までは親の控除は満額（所得税63万円、住民税45万円）で、そのあとも所得税は159万円まで、住民税は169万円まで満額のままです（特定親族特別控除）。そこから段階的に減り、197万円を超えるとなくなります。", en: "Only the student is counted (in this example the \"household\" is just the student). The parents are treated as a separate household, so the tax break they get for supporting the student is not included. When the student earns more, the parents' tax break shrinks or ends. On 2026 income, the parents get the full amount (¥630,000 off income for income tax, ¥450,000 for resident tax) while the student's pay is up to ¥1.36m, and still the full amount up to ¥1.59m for income tax and ¥1.69m for resident tax (the special deduction for relatives aged 19 to 22). It then falls in steps and ends above ¥1.97m."}  # OPEN_QUESTIONS Q16
  - {ja: "年収が150万円（19〜22歳の扶養家族の上限）未満のあいだは、親の会社の健康保険に扶養家族として入っています。", en: "Is covered by a parent's company health insurance as a dependant while yearly income stays under ¥1.5m (the limit for dependants aged 19 to 22)."}
  - {ja: "国民年金の学生納付特例を使い、2026年は保険料を払いません。この特例は、本人の所得から社会保険料を引いた額が128万円以下のときだけ使えます（この世帯では給与が年約220万円（219万6,000円）から使えず、国民年金保険料を払います）。（近似）実際は前の年の所得で判定しますが、ここではその年の所得で判定しています。", en: "Uses the student deferral for National Pension, so pays no pension contributions in 2026. The deferral is allowed only while the student's income, after social insurance, is ¥1.28m or less (for this household, up to a salary of about ¥2.2m (from ¥2,196,000); from there, National Pension is paid). (Approximation) In law the previous year's income decides; here the same year's does."}  # sources/social/nenkin_gakusei_nofu_tokurei.html
  - {ja: "（近似）給与は毎月同じ額で、ボーナスはないものとしています。", en: "(Approximation) Pay is the same every month, with no bonus."}
  - {ja: "東京都新宿区に住んでいるものとしています。", en: "Lives in Shinjuku, Tokyo."}  # project owner's choice
