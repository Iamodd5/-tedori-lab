assumptions:
  - {ja: "一人暮らしで、扶養に入れてくれる家族がいません。そのため、扶養から外れて自分で保険料を払い始める「130万円の壁」は当てはまりません。会社の保険に入らない月は、自分で国民健康保険と国民年金の保険料を払います。", en: "Lives alone, so there is no family member whose health insurance could cover them. The ¥1.3m 'wall' (where a dependant has to start paying their own insurance) therefore does not apply. In any month outside company insurance, they pay National Health Insurance and National Pension contributions themselves."}  # OPEN_QUESTIONS Q21
  - {ja: "収入が少ない人は、国民年金保険料の免除を申請できます。一人暮らしなら、所得が67万円以下のときに全額免除になります。この世帯では、会社の保険に入らない年収1,056,000円未満のすべてが当てはまります。全額免除になると、年215,040円の保険料がなくなります。ただし、その期間の分として将来受け取る年金（老齢基礎年金）は半分になります。ここでは、申請しないものとして計算しています。そのため、収入がとても少ないときの手取りは、申請した場合より少なく出ます。", en: "People on a low income can apply for an exemption from National Pension contributions. Someone living alone gets a full exemption on income of up to ¥670,000. For this household that covers every salary below ¥1,056,000, where it is outside company insurance. With a full exemption the ¥215,040 a year is not paid, but the basic pension earned for that period is halved. We assume no application is made, so at very low incomes take-home pay comes out lower than it would with an exemption."}  # OPEN_QUESTIONS Q20; 国民年金法施行令6条の7
  - {ja: "従業員51人以上の会社で週20時間以上働いていて、学生ではありません。2026年9月までは、月給が8.8万円以上のときだけ会社の健康保険と厚生年金に入る決まりでした。これが「106万円の壁」と呼ばれた条件です。この条件は2026年10月1日になくなりました。ただし、どの地域の最低賃金でも、週20時間働けば月8.8万円を超えます。そのため10月からも、週20時間以上働いて月給が8.8万円未満になるのは、最低賃金の減額特例を受けている人だけです。この人たちは、自分で申し出ないかぎり会社の保険に入りません。そこで、年収1,056,000円未満では、1年を通して国民健康保険と国民年金に入るものとして計算しています。会社の保険に入る申し出はしないものとしています。雇用保険には給料の条件がないため、どの年収でも雇用保険料を払います。", en: "Works 20+ hours a week at a company with more than 50 employees, and is not a student. Until September 2026, part-timers joined the company's health insurance and pension only if their monthly pay was ¥88,000 or more. This was the condition behind the '¥1.06m wall', and it ended on 1 October 2026. At every regional minimum wage, however, 20 hours a week pays more than ¥88,000 a month. So from October the only people on 20+ hours who are paid less than ¥88,000 a month are workers with a minimum-wage exception, and they join company insurance only if they ask. For a salary below ¥1,056,000 a year, we therefore count National Health Insurance and National Pension for the whole year, on the assumption that they do not ask. Employment insurance has no pay condition, so it is paid at every income."}  # 厚生年金保険法附則4条の6, 健康保険法附則8条の3の2, MHLW 令和8年度地域別最低賃金, 雇用保険法6条 (wall_H1.md revision 2)
  - {ja: "（近似）給与は毎月同じ額で、ボーナスはないものとしています。", en: "(Approximation) Pay is the same every month, with no bonus."}
  - {ja: "東京都新宿区に住んでいるものとしています。", en: "Lives in Shinjuku, Tokyo."}  # project owner's choice
