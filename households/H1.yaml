assumptions:
  - {ja: "一人暮らしで、扶養に入れてくれる家族がいません。そのため、扶養から外れて自分で保険料を払い始める「130万円の壁」は当てはまりません。会社の保険に入らない月は、自分で国民健康保険と国民年金の保険料を払います。", en: "Lives alone, so there is no family member whose health insurance they could be covered by. That means the ¥1.3m \"wall\" (where a dependant has to start paying their own insurance) doesn't apply: in any month they are not in company insurance, they pay National Health Insurance and National Pension themselves."}  # OPEN_QUESTIONS Q21
  - {ja: "収入が少ない人の国民年金保険料の免除は入れていないため、収入がとても少ないときの手取りは実際より少なく出ます。", en: "Reduced National Pension payments for people on low income are not included, so take-home pay at very low incomes comes out lower than it really would be."}  # OPEN_QUESTIONS Q20
  - {ja: "週20時間以上、従業員51人以上の会社で働いていて、学生ではありません。2026年9月までは、月給が8.8万円以上のときだけ会社の健康保険と厚生年金に入る決まりでした（「106万円の壁」と呼ばれた条件）。この条件は2026年10月1日になくなりました。ただし、どの地域の最低賃金でも週20時間働けば月8.8万円を超えるため、10月からも週20時間以上で月給8.8万円未満の人は、最低賃金の減額特例を受けている人だけです。この人たちは、自分で申し出ないかぎり会社の保険に入りません。そのため年収1,056,000円未満では、1年を通して国民健康保険と国民年金として計算しています（申し出はしないものとしています）。雇用保険には給料の条件がないため、どの年収でも雇用保険料を払います。", en: "Works 20+ hours a week at a company with more than 50 employees, and is not a student. Until September 2026, part-timers joined the company's health insurance and pension only if monthly pay was ¥88,000 or more (the condition behind the \"¥1.06m wall\"). That condition ended on 1 October 2026. But at every regional minimum wage, 20 hours a week pays more than ¥88,000 a month, so from October the only people on 20+ hours paid less are workers with a minimum-wage exception, and they join company insurance only if they ask. Below ¥1,056,000 a year we therefore count National Health Insurance and National Pension for the whole year (assuming they don't ask). Employment insurance has no pay condition, so they pay it at every income."}  # 厚生年金保険法附則4条の6, 健康保険法附則8条の3の2, MHLW 令和8年度地域別最低賃金, 雇用保険法6条 (wall_H1.md revision 2)
  - {ja: "（近似）給与は毎月同じ額で、ボーナスはないものとしています。", en: "(Approximation) Pay is the same every month, with no bonus."}
  - {ja: "東京都新宿区に住んでいるものとしています。", en: "Lives in Shinjuku, Tokyo."}  # chosen in HUMAN_TODO H-8
