# Rengo (連合) proposal: two parts, a work-support credit (就労支援給付制度) and a consumption-tax refund
# (消費税還付制度（税バック制度）). Documents obtained 2026-11-01. The consumption-tax refund has
# no published amounts, so the design cannot be calculated yet (OPEN_QUESTIONS Q3).
name_ja: 連合案
name_en: Rengo (Japanese Trade Union Confederation) proposal
label: {ja: 連合案, en: "Rengo (trade union confederation) plan"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "給与の低い会社員の保険料の半分を所得税から差し引き（差額は現金）、所得の低い人には消費税分を現金で支給する（あわせて食料品などの軽減税率を廃止）。後半の金額はまだ公表されていない。"
  en: "Takes half of lower-paid employees' insurance payments off their income tax (any extra paid in cash), and gives people on low incomes cash for consumption tax (while abolishing the reduced tax rate on food). The amounts for the second part haven't been published."
summary:
  ja: "労働組合の全国組織である連合の案です。ここで扱うのは、連合の「税制改革構想（第4次）」（改訂版、2025年5月28日）と「2026年度 連合の重点政策」にある「給付付き税額控除」の部分で、二つの制度からなります（基礎控除を税額控除に変えるなど、同じ構想のほかの提案は含めていません）。一つ目（就労支援給付制度）は、雇われて働く人が対象で（自営業の人は対象外）、給与収入74万〜250万円の会社員などについて（2025年の構想では65万円から）、本人が払う社会保険料・雇用保険料の半額を所得税から差し引き、所得税より大きい分は現金で払う制度です（給与収入200万円を超えると減っていき、250万円でなくなります）。二つ目（消費税還付制度）は、所得税がかからない程度の収入の人に、飲食料品や光熱費など最低限の買い物にかかる消費税の分を、扶養している人数に応じた定額で払う制度で、所得がその水準を超えると徐々に減ってなくなります。連合の構想では、この還付の導入に合わせて、食料品などの軽減税率（8%）を廃止するとしています。連合自身の想定では、必要な財源は、一つ目が1.5〜2兆円程度（対象は給与収入65万〜250万円の雇われて働く人約2100万人。このうち、額が減っていく200万〜250万円の人が約600万人）、二つ目が消費税収の1割弱程度（対象4000万人程度）です（構想の27〜28ページ）。二つ目の1人あたりの金額はまだ公表されていません。"
  en: "A proposal from Rengo, Japan's national federation of trade unions. This site covers the \"refundable tax credit\" part of Rengo's Tax Reform Plan (4th edition, revised, 28 May 2025) and its 2026 key policies, which has two schemes (other proposals in the same plan, such as turning the basic deduction into a tax credit, are not included). First (the work-support credit), for employees only (not the self-employed): those earning ¥740,000 to ¥2.5m in salary (from ¥650,000 in the 2025 plan) get half of the social and employment insurance they pay taken off their income tax, and any part bigger than their income tax is paid in cash (it shrinks above ¥2m and is gone at ¥2.5m). Second (the consumption tax refund), people with incomes too low to pay income tax get a fixed cash amount, depending on how many people they support, to cover the consumption tax on basic spending such as food and utilities; it shrinks and ends as income rises above that level. Rengo's plan also abolishes the reduced 8% consumption tax rate on food and other items when the refund starts. Rengo's own estimate of the cost is about ¥1.5–2 trillion for the first scheme (about 21 million employees earning ¥650,000 to ¥2.5m, of whom about 6 million are in the ¥2m–¥2.5m band where it shrinks) and a little under 10% of consumption tax revenue for the second (about 40 million people) (plan, pages 27–28). The per-person amounts for the second scheme haven't been published."
start_year: null  # neither document gives a start date
status: unresolved

source:
  kousou:
    title: 連合「税制改革構想（第4次）」（改訂版）（第95回中央委員会確認 2025.5.28）
    url: https://www.jtuc-rengo.or.jp/activity/kurashi/zei/data/zeiseikaikakukoso20250528.pdf
    file: sources/rengo/zeiseikaikakukoso20250528.pdf  # not in git (sources/EXTERNAL.tsv)
    published: 2025-05-28
  juten_2026:
    title: 2026年度 連合の重点政策（社会保障国民会議 令和8年5月19日 資料3）
    url: https://www.cas.go.jp/jp/seisaku/kokuminkaigi/contents/20260519/03_siryou3.pdf
    file: sources/rengo/kokuminkaigi_20260519_siryou3.pdf  # not in git (sources/EXTERNAL.tsv)
    published: 2026-05  # brochure dated 2026年5月; council meeting 2026-05-19

parameters:
  work_support_benefit:  # 就労支援給付制度
    unit:
      value: individual employee  # 雇用労働者
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    credit_share_of_contributions:  # half of the worker's own social + employment insurance contributions
      value: 0.5
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    refundable:  # 控除額が所得税額を上回る場合は、差額を還付
      value: true
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    salary_lower_bound:  # 給与収入74万円; the 2025 plan says 65万円 (kousou p.27), i.e. each year's employment-income minimum
      value: 740000
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    phase_out_start_salary:  # 給与収入200万円を超えると段階的に低減
      value: 2000000
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    phase_out_end_salary:  # 250万円で消失
      value: 2500000
      cite: {source: kousou, page: 27, section: "５．（１）制度のイメージ (printed p.25)"}
      status: resolved
    phase_out_shape:  # "段階的に低減" / "徐々に低減": straight line or steps not stated
      value: null
      status: unresolved
      question: Q34
    contributions_counted:  # 社会保険料・雇用保険料（労働者負担分）: whether long-term care and the child-support levy count is not stated
      value: null
      status: unresolved
      question: Q35
  consumption_tax_refund:  # 消費税還付制度（税バック制度）
    eligibility:
      value: "people whose total income (合計所得) is at or below the income-tax threshold (課税最低限); flat amount by number of dependants; tapers above the threshold"
      cite: {source: kousou, page: 28, section: "５．（２）制度のイメージ (printed p.26)"}
      status: resolved
    amount:
      value: null
      status: unresolved
      question: Q3
    phase_out:
      value: null
      status: unresolved
      question: Q3
    reduced_rate:  # 「消費税還付制度（税バック制度）の導入に伴い、軽減税率制度を廃止する」: food goes from 8% to 10%, so food spending is needed
      value: abolished when the refund starts
      cite: {source: kousou, page: 33, section: "各論Ⅳ２（２）"}
      status: resolved

notes: >
  The work-support credit is fully described apart from Q34 and Q35. Rengo's own worked example (juten_2026 p.2,
  single employee on 2.0m salary) shows a refund of 152,000, but its stated rule gives 152,000 − 3,300 income tax
  = 148,700 (OPEN_QUESTIONS Q36), so it is not used as a test. The consumption-tax refund gives only its shape and
  a total cost "under about 10% of consumption tax revenue" (kousou p.28); no amounts.
