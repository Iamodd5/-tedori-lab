# Rengo (連合) proposal: two parts, a work-support credit (就労支援給付制度) and a consumption-tax refund
# (消費税還付制度（税バック制度）). Documents obtained 2026-11-01. The consumption-tax refund has
# no published amounts, so the design cannot be calculated yet (OPEN_QUESTIONS Q3).
name_ja: 連合案
name_en: Rengo (Japanese Trade Union Confederation) proposal
label: {ja: 連合案, en: "Rengo (trade union confederation) plan"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "一つは、雇われて働く人のうち所得の低い人について、本人が払う社会保険料と雇用保険料の半額を、所得税から差し引く制度です。差し引ききれない分は還付します。もう一つは、所得税がかからない程度の所得の人を中心に、飲食料品や光熱費など最低限の基礎的な消費にかかる消費税の分を、定額で還付する制度です。連合は、この制度の導入に伴い、軽減税率制度（飲食料品などの消費税を軽くしている制度）を廃止するとしています。もう一つの制度の金額は、連合の資料に示されていません。このため、このサイトではこの案をまだ計算できません。"
  en: "Under one scheme, low-income employees have half of the social and employment insurance they pay taken off their income tax. Any part that can't be taken off is refunded. Under the other, people get a fixed refund for the consumption tax on minimum basic spending such as food, drink and utilities. It goes mainly to people with incomes too low to pay income tax. Rengo says it would abolish the reduced consumption tax rate when this refund starts. Rengo's documents don't give the amounts for the second scheme, so this site can't calculate the plan yet."
summary:
  ja: "日本労働組合総連合会（連合）の案です。ここで扱うのは、連合の「税制改革構想（第4次）」（改訂版、2025年5月28日）と「2026年度 連合の重点政策」にある「給付付き税額控除」の部分です。連合は、「給付付き税額控除」の仕組みを作り、二つの制度を新たに導入することを求めています。基礎控除を税額控除に変えるなど、同じ構想のほかの提案は、ここでは扱いません。一つ目は「就労支援給付制度」です。対象は、給与収入74万〜250万円で、社会保険料と雇用保険料を負担している雇われて働く人です。2025年の構想では、65万円からとしています。本人が払う社会保険料と雇用保険料の半額を、所得税から差し引きます。差し引く額が所得税より大きい場合は、その差額を還付します。給与収入が200万円を超えると差し引く額が減っていき、250万円でなくなります。二つ目は「消費税還付制度」です。所得税がかからない程度の所得の人を中心に、飲食料品や光熱費など最低限の基礎的な消費にかかる消費税の分を、定額で還付します。還付する額は、扶養者数に応じて決まります。所得が、所得税がかからない水準を超えると、還付する額は徐々に減っていき、なくなります。連合の構想では、この還付の導入に伴い、軽減税率制度（外食・酒類を除く飲食料品と定期購読の新聞にかかる8%の税率）を廃止するとしています。必要な財源について、連合自身の想定は次のとおりです（構想の27〜28ページ）。一つ目の制度は、1.5〜2兆円程度です。対象は、給与収入65万〜250万円で保険料を負担している雇われて働く人で、約2100万人です。このうち、額が減っていく200万〜250万円の人が約600万人です。二つ目の制度は、消費税に換算した場合で税収の1割弱程度です。対象は4000万人程度です。二つ目の制度の1人あたりの金額は連合の資料に示されていないため、このサイトではこの案をまだ計算できません。"
  en: "This is a proposal from the Japanese Trade Union Confederation (Rengo). This site covers the \"refundable tax credit\" part of Rengo's Tax Reform Plan (4th edition, revised, 28 May 2025) and its 2026 key policies. Rengo calls for building a refundable tax credit and introducing two new schemes. Other proposals in the same plan, such as turning the basic deduction into a tax credit, are not covered here. The first scheme is the work-support credit. It is for employees earning ¥740,000 to ¥2.5m in salary who pay social and employment insurance. In the 2025 plan the range started at ¥650,000. Half of the social and employment insurance they pay is taken off their income tax. If that amount is bigger than their income tax, the difference is refunded. Above ¥2m in salary the amount taken off shrinks, and it is gone at ¥2.5m. The second scheme is the consumption tax refund. Mainly for people with incomes too low to pay income tax, it refunds a fixed amount to cover the consumption tax on minimum basic spending such as food, drink and utilities. The amount depends on the number of dependants. It shrinks gradually as income rises above the level where income tax starts, and then ends. Rengo's plan says it would abolish the reduced-rate system (the 8% rate on food and drink other than eating out and alcohol, and on newspaper subscriptions) when the refund is introduced. Rengo gives its own estimates of the cost (plan, pages 27–28). For the first scheme it is about ¥1.5–2 trillion. That scheme covers about 21 million employees earning ¥650,000 to ¥2.5m who pay these insurance contributions, of whom about 6 million are in the ¥2m–¥2.5m band where the amount shrinks. For the second scheme it is, expressed in consumption tax, a little under 10% of tax revenue. That scheme covers about 40 million people. Rengo's documents don't give the per-person amounts for the second scheme, so this site can't calculate the plan yet."
start_year: null  # neither document gives a start date
status: unresolved

source:
  kousou:
    title: 連合「税制改革構想（第4次）」（改訂版）（第95回中央委員会確認 2025.5.28）
    url: https://www.jtuc-rengo.or.jp/activity/kurashi/zei/data/zeiseikaikakukoso20250528.pdf
    file: sources/rengo/zeiseikaikakukoso20250528.pdf  # not in git (sources/EXTERNAL.tsv)
    published: 2025-05-28
  juten_2026:
    title: 2026年度 連合の重点政策（社会保障国民会議 令和8年5月19日 資料3）
    url: https://www.cas.go.jp/jp/seisaku/kokuminkaigi/contents/20260519/03_siryou3.pdf
    file: sources/rengo/kokuminkaigi_20260519_siryou3.pdf  # not in git (sources/EXTERNAL.tsv)
    published: 2026-05  # brochure dated 2026年5月; council meeting 2026-05-19

parameters:
  work_support_benefit:  # 就労支援給付制度
    unit:
      value: individual employee  # 雇用労働者
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    credit_share_of_contributions:  # half of the worker's own social + employment insurance contributions
      value: 0.5
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    refundable:  # 控除額が所得税額を上回る場合は、差額を還付
      value: true
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    salary_lower_bound:  # 給与収入74万円; the 2025 plan says 65万円 (kousou p.27), i.e. each year's employment-income minimum
      value: 740000
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    phase_out_start_salary:  # 給与収入200万円を超えると段階的に低減
      value: 2000000
      cite: {source: juten_2026, page: 2, section: "図2"}
      status: resolved
    phase_out_end_salary:  # 250万円で消失
      value: 2500000
      cite: {source: kousou, page: 27, section: "５．（１）制度のイメージ (printed p.25)"}
      status: resolved
    phase_out_shape:  # "段階的に低減" / "徐々に低減": straight line or steps not stated
      value: null
      status: unresolved
      question: Q34
    contributions_counted:  # 社会保険料・雇用保険料（労働者負担分）: whether long-term care and the child-support levy count is not stated
      value: null
      status: unresolved
      question: Q35
  consumption_tax_refund:  # 消費税還付制度（税バック制度）
    eligibility:
      value: "people whose total income (合計所得) is at or below the income-tax threshold (課税最低限); flat amount by number of dependants; tapers above the threshold"
      cite: {source: kousou, page: 28, section: "５．（２）制度のイメージ (printed p.26)"}
      status: resolved
    amount:
      value: null
      status: unresolved
      question: Q3
    phase_out:
      value: null
      status: unresolved
      question: Q3
    reduced_rate:  # 「消費税還付制度（税バック制度）の導入に伴い、軽減税率制度を廃止する」: food goes from 8% to 10%, so food spending is needed
      value: abolished when the refund starts
      cite: {source: kousou, page: 33, section: "各論Ⅳ２（２）"}
      status: resolved

notes: >
  The work-support credit is fully described apart from Q34 and Q35. Rengo's own worked example (juten_2026 p.2,
  single employee on 2.0m salary) shows a refund of 152,000, but its stated rule gives 152,000 − 3,300 income tax
  = 148,700 (OPEN_QUESTIONS Q36), so it is not used as a test. The consumption-tax refund gives only its shape and
  a total cost "under about 10% of consumption tax revenue" (kousou p.28); no amounts.

