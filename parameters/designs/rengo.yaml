  - claim: {ja: "必要な財源について、連合自身の想定は次のとおりです（構想の27〜28ページ）。一つ目の制度は、1.5〜2兆円程度です。対象は、給与収入65万〜250万円で保険料を負担している雇われて働く人で、約2100万人です。このうち、額が減っていく200万〜250万円の人が約600万人です。二つ目の制度は、消費税に換算した場合で税収の1割弱程度です。対象は4000万人程度です。", en: "Rengo gives its own estimates of the cost (plan, pages 27–28). For the first scheme it is about ¥1.5–2 trillion. That scheme covers about 21 million employees earning ¥650,000 to ¥2.5m who pay these insurance contributions, of whom about 6 million are in the ¥2m–¥2.5m band where the amount shrinks. For the second scheme it is, expressed in consumption tax, a little under 10% of tax revenue. That scheme covers about 40 million people."}
