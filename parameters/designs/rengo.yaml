  - claim: {ja: "二つ目は「消費税還付制度」です。所得税がかからない程度の所得の人を中心に、飲食料品や光熱費など最低限の基礎的な消費にかかる消費税の分を、定額で還付します。還付する額は、扶養者数に応じて決まります。所得が、所得税がかからない水準を超えると、還付する額は徐々に減っていき、なくなります。", en: "The second scheme is the consumption tax refund. Mainly for people with incomes too low to pay income tax, it refunds a fixed amount to cover the consumption tax on minimum basic spending such as food, drink and utilities. The amount depends on the number of dependants. It shrinks gradually as income rises above the level where income tax starts, and then ends."}
