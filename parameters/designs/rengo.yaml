  - claim: {ja: "一つ目は「就労支援給付制度」です。対象は、給与収入74万〜250万円で、社会保険料と雇用保険料を負担している雇われて働く人です。2025年の構想では、65万円からとしています。本人が払う社会保険料と雇用保険料の半額を、所得税から差し引きます。差し引く額が所得税より大きい場合は、その差額を還付します。給与収入が200万円を超えると差し引く額が減っていき、250万円でなくなります。", en: "The first scheme is the work-support credit. It is for employees earning ¥740,000 to ¥2.5m in salary who pay social and employment insurance. In the 2025 plan the range started at ¥650,000. Half of the social and employment insurance they pay is taken off their income tax. If that amount is bigger than their income tax, the difference is refunded. Above ¥2m in salary the amount taken off shrinks, and it is gone at ¥2.5m."}
