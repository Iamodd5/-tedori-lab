# Two-year bridge package (つなぎ), FY2027–FY2028.
# Chosen by the project owner: the food consumption tax cut and the
# bridge-period 就業者負担軽減支援金 are one package; results show them as separate components.
name_ja: 飲食料品消費税率の臨時的な引下げ＋就業者負担軽減支援金（つなぎ、令和9・10年度）
name_en: Temporary food consumption tax cut + bridge worker burden-relief payment (FY2027–FY2028)
label: {ja: 政府案（2027〜28年度のつなぎ：食料品の消費税1%＋給付）, en: "Government plan (FY2027–28 bridge: 1% tax on food + payment)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "2027〜28年度、食料品の消費税を8%から1%に下げ、働く人への所得に応じた支給（就業者負担軽減支援金）を先に始める。支給には勤労所得、合計所得、払っている税金と保険料の条件がある。支給額と条件の線引きはまだ決まっていない。"
  en: "In fiscal 2027–28, consumption tax on food falls from 8% to 1%, and an income-based payment to people in work (the worker burden-relief payment) starts early, with conditions on earned income, total income and the tax and insurance you pay. The payment amounts and limits haven't been decided."
summary:
  ja: "政府が2026年10月9日に国会に提出した法律案の内容です（2026年11月3日時点で衆議院で審議中）。2027年4月から2029年3月まで、いま8%の軽減税率がかかっている飲食料品の消費税を1%に下げます。同じ期間、就業者負担軽減支援金を先に始めて、所得に応じて支給します（2029年度からの形と違い、配偶者の所得の条件はなく、子どもの上乗せは16歳未満が対象）。支給額は、各年度の支給の総額が、その年度の1%分の飲食料品の消費税の税収（見込み）を超えないことを考慮して決めることになっています（2029年4月に支給される2029年度からの形への移行分は除く）。その年の1月1日に日本に住所がない人には支給されません（国籍による条件は書かれていません）。「年収の壁」に直面する人などへの上乗せ（就業促進特例加算）も、この期間から支給します（大綱8〜9ページ）。支給額は、法律案では後で政令で決めることになっていて、まだ決まっていません。"
  en: "This is the content of a bill the government submitted to the Diet on 9 October 2026 (still being debated in the House of Representatives on 3 November 2026). From April 2027 to March 2029, consumption tax on food and drink that is now taxed at the reduced 8% rate falls to 1%. Over the same period the worker burden-relief payment starts early, paid according to income (unlike the form from fiscal 2029, there is no test of the spouse's income, and the extra for children covers children under 16). The amounts are to be set taking into account that each year's total payments should not exceed that year's expected revenue from the remaining 1% consumption tax on food (not counting the April 2029 advance of the fiscal 2029 form). People with no address in Japan on 1 January of the year are not paid (no nationality condition is written). The top-up for people facing an income wall and others (就業促進特例加算) is also paid in this period (outline, pages 8–9). Under the bill, the payment amounts will be set later by Cabinet order; they haven't been decided."
start_year: 2027
status: unresolved

