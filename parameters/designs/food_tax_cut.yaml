    url: https://www.cas.go.jp/jp/seisaku/kokuminkaigi/contents/20260915/01_siryou1.pdf
    file: sources/gov/20260915_01_siryou1.pdf
    published: 2026-09-15
  bill_summary:
    title: 「租税及び社会保険料による負担の軽減のための飲食料品に係る消費税率の臨時的な引下げ及び就業者負担軽減支援金の支給に関する法律案」について（概要）
    url: https://www.cas.go.jp/jp/seisaku/kokuminkaigi/contents/20261009/siryou1.pdf
