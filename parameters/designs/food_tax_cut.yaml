# Modelling assumptions (not policy numbers). Shown on the site with the "approximation" label.
assumptions:
  price_pass_through:
    value: 1.0
    approximation: true
    explanation: "Assume the whole tax cut reaches shelf prices (spec Section 8). A 50% pass-through sensitivity is also shown."
    sensitivity: [0.5]

notes: >
  The tax-rate side is fully specified. The payment side has the same structure as government_final but
  with FY2027–28 differences (children under 16, no spouse test, social-insurance deduction used for the
  net-burden test) and a total budget equal to about 1% of food consumption tax; individual amounts are
  left to Cabinet order (bill summary p.1). FY2029 (令和11年度) transition payments (two half-year payments)
  are not modelled. The basic policy calls the combined effect a "real zero" consumption tax on food
  (basic policy p.3, 4.(3)); this tool reports each component separately and does not adopt that label.
