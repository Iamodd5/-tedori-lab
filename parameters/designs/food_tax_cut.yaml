# Two-year bridge package (つなぎ), FY2027–FY2028.
# Chosen by the project owner: the food consumption tax cut and the
# bridge-period 就業者負担軽減支援金 are one package; results show them as separate components.
name_ja: 飲食料品消費税率の臨時的な引下げ＋就業者負担軽減支援金（令和9・10年度）
name_en: Temporary food consumption tax cut + worker burden-relief payment (FY2027–FY2028)
label: {ja: 政府案（2027〜28年度：食料品の消費税1%＋給付）, en: "Government plan (FY2027–28: 1% tax on food + payment)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "2027年4月から2029年3月まで、いま8%の軽減税率がかかっている飲食料品の消費税を1%に下げます。同じ期間に、所得が中くらい以下の働く人に、所得に応じた支援金（就業者負担軽減支援金）を支給します。政府は、この2年間の仕組みを、2029年度の本格導入までの「つなぎ」としています。支援金の対象になるのは、働いて得た所得が一定額を超え、すべての所得を合わせた額が一定額以下の人です。払っている税金と社会保険料の合計から、受け取っている公的年金などを引いた額が、一定額を超えることも条件です。支給額と、条件の線引きとなる金額は、法律案では政令（内閣が定める命令）で定めることになっています。"
  en: "From April 2027 to March 2029, consumption tax on food and drink that is now taxed at the reduced 8% rate falls to 1%. Over the same period, people in work on low and middle incomes get a payment based on their income (the worker burden-relief payment). The government calls this two-year arrangement a bridge to the full introduction in fiscal 2029. To get the payment, earned income must be above a set level and total income at or below a set level. The tax and social insurance you pay, minus any public pension you receive, must also be above a set level. Under the bill, the payment amounts and the levels used in the conditions are to be set by Cabinet order."
summary:
  ja: "2026年10月9日に閣議決定され、同じ日に国会に提出された法律案の内容です。2027年4月から2029年3月まで、いま8%の軽減税率がかかっている飲食料品の消費税を1%に下げます。同じ期間に、就業者負担軽減支援金を所得に応じて支給します。2029年度からの形と違って、配偶者の所得の条件はなく、子どもの上乗せの対象は16歳未満です。政府は大綱（2026年9月15日閣議決定）で、この2年間の仕組みを、2029年度の本格導入までの「つなぎ」としています。法律案では、2027年度分と2028年度分の支給額は、次の点を考慮して定めることになっています。その年度の支給の総額が、その年度に飲食料品にかかる1%の消費税（地方消費税を含む）の収入見込額を超えないようにすることです。2029年度からの形に円滑に移るために2029年4月に支払う2028年度分の上乗せは、この総額に含みません。その年度が始まる年の1月1日に日本国内に住所がない人には支給されません。いわゆる「年収の壁」に直面する人と、同じ程度の社会保険料を負担する人には、上乗せ（就業促進特例加算）があります。大綱はこの上乗せを、「年収の壁」が解消するまでの時限的な措置としています（大綱9ページ）。2027・28年度の支援金については、この上乗せを社会保険料控除額により適用するとしています（大綱8ページ）。支給額と、条件の線引きとなる金額は、法律案では政令（内閣が定める命令）で定めることになっています。"
  en: "This is the content of a bill that the Cabinet approved on 9 October 2026 and that was submitted to the Diet the same day. From April 2027 to March 2029, consumption tax on food and drink that is now taxed at the reduced 8% rate falls to 1%. Over the same period the worker burden-relief payment is paid according to income. Unlike the form used from fiscal 2029, it has no test of the spouse's income, and the extra for children covers children under 16. In its outline approved by the Cabinet on 15 September 2026, the government calls this two-year arrangement a bridge to the full introduction in fiscal 2029. Under the bill, the payment amounts for fiscal 2027 and fiscal 2028 are to be set with the following in mind. Each year's total payments should not exceed that year's expected revenue from the 1% consumption tax on food, local consumption tax included. This total leaves out the extra fiscal 2028 amount paid in April 2029 to move smoothly to the form used from fiscal 2029. People with no address in Japan on 1 January of the year in which the fiscal year starts are not paid. People facing an income wall (年収の壁), and people with a similar social insurance burden, get a top-up (就業促進特例加算). The outline describes this top-up as a time-limited measure until the income wall is removed (outline, page 9). For fiscal 2027–28 payments, it says this top-up is applied using the social insurance deduction amount (outline, page 8). Under the bill, the payment amounts and the levels used in the conditions are to be set by Cabinet order."
start_year: 2027
status: unresolved

