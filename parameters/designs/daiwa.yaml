# Daiwa Institute of Research proposal: 社会保険料還付付き税額控除 (social-insurance-refundable tax credit).
# The report tests 8 variants (Figure 4, p.5). The parameters below are the variant the report's summary
# highlights (p.1, p.7): income-tax basic deduction abolished and replaced by a 56,500-yen credit.
# Which variant(s) to show is the project owner's decision (OPEN_QUESTIONS Q10); the others are listed under `variants`.
name_ja: 社会保険料還付付き税額控除（大和総研案）
name_en: Social-insurance-refundable tax credit (Daiwa Institute of Research proposal)
label: {ja: 大和総研案（2026年の税制に合わせて計算）, en: "Daiwa Institute plan (adjusted to 2026 tax rules)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "すべての納税者について、所得税の基礎控除（税金を計算する前に所得から差し引く額）をなくします。代わりに、所得税から直接差し引く一定の額（税額控除）を設けます。税額控除が所得税より大きい人には、差額を現金で払います。払う額は、働いて得た所得にかかる社会保険料の額までです。"
  en: "For every taxpayer, this plan removes the income tax basic deduction (an amount taken off income before tax is worked out). In its place it gives a fixed tax credit, an amount taken straight off income tax. If the credit is bigger than your income tax, the difference is paid to you in cash. You can get up to the amount of social insurance you paid on income from work."
summary:
  ja: "民間の研究所である大和総研が2025年10月に出した「社会保険料還付付き税額控除」の案です。すべての納税者について、所得税の基礎控除（税金を計算する前に所得から差し引く額）をなくします。代わりに、所得税から直接差し引く一定の額（税額控除）を設けます。税額控除が所得税より大きい人には、差額を現金で払います。払う額は、働いて得た所得（給与や事業の所得など）にかかる社会保険料の額までです。一部の保険料は、給与や事業の所得など、働いて得た所得がある人についてだけ、この上限に数えます。国民健康保険料、国民年金保険料、65歳以上の人の介護保険料、後期高齢者医療制度の保険料です。主に年金や資産からの所得、資産の取り崩しで暮らす人は、働いて得た所得にかかる社会保険料がないため、現金を受け取れません。住民税は変えません。大和総研のレポートは、条件を変えた8通りを試算しています。変えている条件は、所得税がかかり始める年収（178万円か203万円か）、基礎控除を税額控除に変える範囲、現金での支給があるかないかです。基礎控除を税額控除に変える範囲は、基礎控除のすべてか、58万円を超える特例の上乗せ分だけかのどちらかです。このサイトは、レポートの要約が取り上げた「基礎控除をすべてなくす、178万円、現金の支給あり」の案を計算しています。"
  en: "This is a proposal for a \"tax credit with a social-insurance refund\", published in October 2025 by the Daiwa Institute of Research, a private research institute. For every taxpayer, it removes the income tax basic deduction (an amount taken off income before tax is worked out). In its place it gives a fixed tax credit, an amount taken straight off income tax. If the credit is bigger than your income tax, the difference is paid to you in cash. You can get up to the amount of social insurance you paid on income from work (such as wages or business income). Some premiums count toward this cap only for people with income from work, such as wages or business income. They are National Health Insurance, National Pension, the long-term care premium of people aged 65 or over, and late-stage elderly medical care premiums. People who live mainly on a pension, income from assets, or by drawing down their assets have no social insurance on income from work, so they get no cash. Resident tax doesn't change. Daiwa's report works out eight versions by changing the conditions. The conditions are the income where income tax starts (¥1.78m or ¥2.03m), how much of the basic deduction becomes a credit, and whether there is a cash payment. Either the whole basic deduction becomes a credit, or only the special top-up above ¥580,000. This site calculates the version in the report's summary: the whole basic deduction removed, ¥1.78m, with the cash payment."
start_year: null  # the report gives no start date; modelled on the 2026 baseline
status: resolved

source:
  daiwa:
    title: 働く低所得者の負担を軽減する「社会保険料還付付き税額控除」の提案 ― 追加財政負担なしで課税最低限（年収の壁）178万円達成も可能
    url: https://www.dir.co.jp/report/research/law-research/tax/20251010_025349.pdf
    file: sources/daiwa/daiwa_20251010.pdf
    published: 2025-10-10

