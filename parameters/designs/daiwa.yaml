# Daiwa Institute of Research proposal: 社会保険料還付付き税額控除 (social-insurance-refundable tax credit).
# The report tests 8 variants (Figure 4, p.5). The parameters below are the variant the report's summary
# highlights (p.1, p.7): income-tax basic deduction abolished and replaced by a 56,500-yen credit.
# Which variant(s) to show is a human decision (OPEN_QUESTIONS Q10); the others are listed under `variants`.
name_ja: 社会保険料還付付き税額控除（大和総研案）
name_en: Social-insurance-refundable tax credit (Daiwa Institute of Research proposal)
label: {ja: 大和総研案（2026年の税制に合わせて計算）, en: "Daiwa Institute plan (adjusted to 2026 tax rules)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "所得税の基礎控除をなくし、代わりに定額の税額控除を設ける。控除が所得税より大きい分は現金で支給する。"
  en: "Replaces the income tax basic deduction with a fixed tax credit. Any part of the credit bigger than your income tax is paid in cash."
summary:
  ja: "民間の研究所である大和総研が2025年10月に出した案です。所得税を払うすべての人について、所得税の基礎控除をなくし、代わりに一定額の税額控除（所得税から直接差し引く額）を設けます。控除が所得税より大きい人には、残りを現金で払いますが、給与や事業の収入にかかる社会保険料として払った額までです。住民税は変えません。"
  en: "A proposal published in October 2025 by the Daiwa Institute of Research, a private research institute. For everyone who pays income tax, it removes the income tax basic deduction and gives a fixed tax credit instead (an amount subtracted straight from income tax). If the credit is bigger than your income tax, the rest is paid to you in cash, but only up to what you paid in social insurance on your wages or business income. Resident tax doesn't change."
start_year: null  # the report gives no start date; modelled on the 2026 baseline
status: resolved

source:
  daiwa:
    title: 働く低所得者の負担を軽減する「社会保険料還付付き税額控除」の提案 ― 追加財政負担なしで課税最低限（年収の壁）178万円達成も可能
    url: https://www.dir.co.jp/report/research/law-research/tax/20251010_025349.pdf
    file: sources/daiwa/daiwa_20251010.pdf
    published: 2025-10-10

parameters:
  unit:
    value: taxpayer  # every income-tax payer (納税者本人分のみ; dependants not counted, p.5 note 10)
    status: resolved
    cite: {source: daiwa, page: 4, section: "図表3"}
  income_tax_basic_deduction:
    value: 0  # basic deduction abolished for income tax (基礎控除全額を税額控除化)
    status: resolved
    cite: {source: daiwa, page: 5, section: "図表4"}
  target_threshold:  # 課税最低限 (年収の壁) the credit is sized to reach
    value: 1780000
    status: resolved
    cite: {source: daiwa, page: 1, section: "要約"}
  tax_credit_rule:  # recomputed on 2026 rules (HUMAN_TODO H-12: B): (1,780,000 − 740,000) × 5% = 52,000
    value: "credit = (target threshold − employment-income minimum − basic deduction) × lowest income-tax rate"
    status: resolved
    cite: {source: daiwa, page: 5, section: "図表4 注1; p.6 課税最低限まで不足する分を税額控除とする"}
  credit_phase_out:
    value: none  # uniform credit; the report notes a phase-out could be added (p.6 note 13) but does not model one
    status: resolved
    cite: {source: daiwa, page: 6, section: "脚注13"}
  refund_limit:
    value: "credit minus income tax, paid only up to the person's social insurance contributions on labour income"
    status: resolved
    cite: {source: daiwa, page: 4, section: "図表3"}
  contributions_counted:
    value: "employee health insurance and pension; NHI, national pension, long-term-care (category 1) and late-elderly premiums only for people with business or employment income"
    status: resolved
    cite: {source: daiwa, page: 4, section: "図表3 (注1)"}
  resident_tax_changed:
    value: false  # 住民税については特に制度変更を行わない
    status: resolved
    cite: {source: daiwa, page: 5, section: "図表4 (注2)"}
  paid_via:
    value: "year-end adjustment (through the employer) or tax return"
    status: resolved
    cite: {source: daiwa, page: 4, section: "図表3 (注2)"}
  affects_pension_records:
    value: false
    status: resolved
    cite: {source: daiwa, page: 4, section: "図表3"}
  reconstruction_surtax_interaction:  # report ignores the surtax "for simplicity" (p.6 note 11); order not stated
    value: "credit taken off before the 2.1% surtax, as existing tax credits are"
    status: resolved
    approximation: true
    explanation: "Daiwa does not state the order; approved by the human 2026-11-01 (HUMAN_TODO H-12)"
    cite: {source: daiwa, page: 6, section: "脚注11"}

variants:  # from Figure 4 (p.5); not modelled unless the human chooses them (Q10)
  - {threshold: 1780000, basic_deduction: 580000, tax_credit: 27500}
  - {threshold: 1780000, basic_deduction: 0, tax_credit: 56500}   # headline, used above
  - {threshold: 2030000, basic_deduction: 580000, tax_credit: 40000}
  - {threshold: 2030000, basic_deduction: 0, tax_credit: 69000}
  # each with and without the social-insurance refund (8 cases)

published_estimates:  # for cross-checking only (spec Section 6), never used as inputs
  tax_credit_under_2025_rules: 56500   # = (1,780,000 − 650,000) × 5%; tests check our formula reproduces it
  cite_credit: {source: daiwa, page: 1}
  headline_variant_with_refund:
    income_tax_increase_trillion_yen: 0.7
    refund_payments_trillion_yen: 0.7
    net_fiscal_cost: "about zero (財政中立)"
    cite: {source: daiwa, page: 7}
  household_change_at_5m_salary_yen: -13000  # 年収500万円の者に年1.3万円の増税
  take_home_recovery_salary_yen: 1200000     # vs 1.24m today, for a worker joining social insurance at 1.06m
  cite: {source: daiwa, page: 7}

# How unresolved items are bridged in the calculation; shown with every Daiwa number (CLAUDE.md rule 3).
approximations:
  - question: Q11
    ja: 所得税には2.1%の復興特別所得税が上乗せされます。大和総研は、税額控除をこの上乗せの前と後のどちらで差し引くかを示していません。ここでは、今ある他の税額控除と同じく、先に税額控除を差し引いてから2.1%を上乗せしています。
    en: Income tax has a 2.1% reconstruction surtax added on top. Daiwa doesn't say whether the credit is subtracted before or after that surtax. We subtract the credit first and then add the 2.1%, which is how existing tax credits work.
  - question: Q18
    ja: 税額控除が所得税より大きいときに現金で払う額は、健康保険（介護保険を含む）と年金の保険料の額までとしています。大和総研は子ども・子育て支援金と雇用保険料を含めるかどうかを示していないため、ここでは含めていません。
    en: When the credit is bigger than your income tax, the cash paid out is capped at what you paid for health insurance (including long-term care insurance) and pension. Daiwa doesn't say whether the child and childcare support levy and employment insurance also count, so we leave them out.

# Shown wherever a Daiwa number appears (HUMAN_TODO H-10: A, OPEN_QUESTIONS Q19).
site_note:
  ja: 大和総研は2025年の税制をもとに、給与で働く人が年収178万円まで所得税を払わずにすむよう、税額控除を5.65万円としました。同じ計算式を2026年の税制に当てはめると、税額控除は5.2万円になります。なお2026年の税制では、この案がなくても、給与で働く人はすでに年収178万円まで所得税がかかりません。このため、ここでの結果は大和総研が公表した数字とは異なります。
  en: Daiwa wrote its plan for 2025 tax rules and set the credit at ¥56,500, so that an employee could earn up to ¥1.78m a year before paying income tax. Using the same formula with 2026 tax rules gives a credit of ¥52,000. Under 2026 rules an employee can already earn ¥1.78m a year before paying income tax, even without this plan. So the results here differ from the numbers Daiwa published.

notes: >
  The report was written against 2025 tax rules (threshold 1.6m in 2025). Applying it to the 2026 baseline
  means our numbers will differ from the published estimates; differences go in docs/VALIDATION.md.
  The report models employees in 協会けんぽ + 厚生年金 with only basic and social-insurance deductions.
