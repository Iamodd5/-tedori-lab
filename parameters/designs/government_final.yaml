# Government design for the full system from FY2029 (令和11年度).
# Chosen by the project owner: the Aug 5, 2026 Cabinet decision,
# detailed where needed by the Jul 29 interim summary, the Sep 15 Cabinet outline and the Oct 9 bill summary.
# The vehicle is the 就業者負担軽減支援金 (worker burden-relief payment). Its full-system form starts FY2029.
# Every yen amount and rate is left by the bill to a Cabinet order (政令), so none are published yet.
name_ja: 就業者負担軽減支援金（支援金制度の本格導入、令和11年度〜）
name_en: Worker burden-relief payment (full system, FY2029 onward)
# The outline calls the payment "本格的な「給付付き税額控除」を導入する第一歩" (outline p.1); the name follows the documents' own
# term for FY2029, "支援金制度の本格導入", and does not call it the full refundable credit.
label: {ja: 政府案（2029年度から）, en: "Government plan (from FY2029)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "2029年度からの形の支給（政府は「本格導入」としている）。所得が中くらい以下の働く人に、前の年の所得と、扶養している19歳未満の親族の数に応じた額を、年度ごとに支給する。勤労所得、合計所得、払っている税金と社会保険料から受け取る公的年金を引いた額、配偶者の所得に条件がある。法律案では、金額と条件の線引きは後で政令で決める。"
  en: "From fiscal 2029, the form of the payment the government calls its full introduction: paid each fiscal year to people in work on low or middle incomes, based on the previous year's income and the number of dependent relatives under 19. There are conditions on earned income, total income, the tax and social insurance you pay minus any public pension you receive, and your spouse's income. Under the bill, the amounts and limits will be set later by Cabinet order."
summary:
  ja: "2026年10月9日に閣議決定され、同じ日に国会に提出された法律案の内容です。就業者負担軽減支援金は2027年4月に始まり、2029年度からこの形になります（政府はこれを「本格導入」としています）。前の年の所得をもとに、年度ごとに支給します。2029年度分は、この形の額の半年分を基本とした額です。これとは別に2029年4月に、2028年度の支給の対象だった人へ、この形の額の半年分を基本とした額が先に支給されます（法律案では2028年度分への上乗せ）。支給額の形は2026年9月15日の大綱によるもので、勤労所得が一定額を超えると支給が始まり、勤労所得が低いうちは定額、そこから勤労所得が増えるにつれて一定の割合で増えたあと定額になり、合計所得が一定額を超えると一定の割合で減っていきます。扶養している19歳未満の親族（日本に住む人）がいる人には、その人数に応じた定額の上乗せ（こども加算）があります。対象になるのは、勤労所得が一定額を超え、合計所得が一定額以下で、払っている税金と社会保険料（受け取る公的年金を差し引いた額）が一定額を超える人です。その年度が始まる年の1月1日に配偶者がいる人は、配偶者の前の年の合計所得が一定額を超えると対象になりません。事業所得と、仕事による雑所得（業務に係る雑所得）も、合わせて一定額を超えるときは、勤労所得に加えます。その年度が始まる年の1月1日に日本国内に住所がない人には支給されません。勤労所得が一定額を超えない人は対象外です。政府は、働いていない高齢者も「対象外となる方」に挙げています（2026年7月30日の総理会見のポイント）。法律案は、この支援金の対象にならない所得の低い働く人や、病気などで働くことが難しい人への必要な措置のあり方を検討して2028年度中に結論を出し、必要があると認めるときは2029年度以降に措置を講ずること、働いていない高齢者などがこの支援金と今の社会保障制度の両方から取り残されないよう、必要な措置のあり方を検討して、次の年金の財政検証が作られる年の翌年までに結論を出すことを定めています（第36条第4項・第5項）。いわゆる「年収の壁」に直面する人と、同じ程度の社会保険料を負担する人には、大綱が「「年収の壁」が解消するまでの時限的な措置」とする上乗せ（就業促進特例加算）もあります。大綱は「年収の壁」を、会社の保険に入ること、または国民健康保険・国民年金に入ることで保険料の負担が増えることとし、上乗せの対象を、勤労所得がパートが会社の保険に入る線（大綱の換算で年収106万円）から、壁で減った手取りが元に戻る水準までで、会社の保険に入ると生じる保険料に当たる額を払った人としています。大綱の例では、扶養されている配偶者（国民年金の第3号被保険者）が年収130万円になり国民年金の第1号被保険者になった場合、税と社会保険料を引いた手取りが元に戻るのは年収約160万円程度です（大綱9〜10ページ）。大綱は、上乗せの額を、「年収の壁」に直面する人に手厚く支給することと、それ以外の人への支給を含めた全体のバランスなどを考えて決めるとしています。費用は国が3分の2以上を負担し、国の分の財源は、赤字国債（特例公債）に頼らず歳出・歳入全般の見直しで確保するとしています（第21条第1項、第39条第1項）。法律案では、金額や条件の線引きは後で政令で決めることになっています。"
  en: "This is the content of a bill that the Cabinet approved on 9 October 2026 and that was submitted to the Diet the same day. The worker burden-relief payment starts in April 2027 and takes this form from fiscal 2029 (the government calls it the full introduction). It is paid each fiscal year, based on the previous year's income. The fiscal 2029 payment is an amount based on half of this form's amount. Separately, in April 2029, people eligible for the fiscal 2028 payment are paid in advance an amount based on half of this form's amount (in the bill, an addition to the fiscal 2028 payment). The shape of the payment comes from the Cabinet outline of 15 September 2026: payment starts once earned income passes a minimum; it is a flat amount while earned income is low, grows at a fixed rate as earned income grows, then stays flat, and shrinks at a fixed rate once total income passes a set level. People who support relatives under 19 living in Japan get a fixed extra amount (こども加算) that depends on how many there are. To qualify, earned income must be above a set level, total income at or below a set level, and the tax and social insurance you pay, minus any public pension you receive, above a set level. A person who has a spouse on 1 January of the year in which the fiscal year starts does not qualify if the spouse's total income in the previous year is above a set level. Business income and miscellaneous income from work (業務に係る雑所得) are also added to earned income when together they are above a set amount. People with no address in Japan on 1 January of the year in which the fiscal year starts are not paid. People whose earned income is not above a set minimum are not covered. The government also lists older people who don't work among the people not covered (points from the Prime Minister's press conference of 30 July 2026). The bill says the government will consider what measures are needed for low earners left out of this payment and for people who find it hard to work because of illness or other reasons, reach a conclusion during fiscal 2028 and, if it finds it necessary, take measures from fiscal 2029; and that it will consider what measures are needed so that older people who don't work and others are not left out of both this payment and the existing social security system, and reach a conclusion by the year after the next public pension review (財政検証) is produced (article 36, paragraphs 4 and 5). People facing an income wall (年収の壁), and people with a similar insurance burden, also get a top-up (就業促進特例加算) that the outline calls temporary until the walls are removed. The outline defines the wall as the extra premiums of joining company insurance or of moving into National Health Insurance and National Pension, and covers people whose earned income is between the line where part-timers join company insurance (¥1.06m of pay a year in the outline's conversion) and the level where the take-home pay lost at the wall is regained, and who paid premiums equal to those of company insurance. In the outline's example, a dependent spouse (a category 3 member of National Pension) who reaches ¥1.3m a year and becomes a category 1 member of National Pension regains take-home pay, after tax and social insurance, at about ¥1.6m a year (outline, pages 9–10). The outline says the top-up's amount will be set considering the overall balance between generous payments to people facing the wall and payments to everyone else, among other things. The national government pays at least two-thirds of the cost, and its share is to be financed without deficit-covering bonds, by reviewing spending and revenue as a whole (article 21, paragraph 1, and article 39, paragraph 1). Under the bill, the amounts and the limits in the conditions will be set later by Cabinet order."
start_year: 2029  # 令和11年度 (fiscal year from April 2029); payment is based on the previous year's income
status: unresolved

