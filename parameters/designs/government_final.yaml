# Government design for the full system from FY2029 (令和11年度).
# Chosen by the human on 2026-10-30 (HUMAN_TODO H-3, option A): the Aug 5, 2026 Cabinet decision,
# detailed where needed by the Jul 29 interim summary, the Sep 15 Cabinet outline and the Oct 9 bill summary.
# The vehicle is the 就業者負担軽減支援金 (worker burden-relief payment). Its full-system form starts FY2029.
# Every yen amount and rate is left by the bill to a Cabinet order (政令), so none are published yet.
name_ja: 就業者負担軽減支援金（支援金制度の本格導入、令和11年度〜）
name_en: Worker burden-relief payment (full system, FY2029 onward)
# The outline calls the payment "本格的な「給付付き税額控除」を導入する第一歩" (outline p.1); the name follows the documents' own
# term for FY2029, "支援金制度の本格導入", and does not call it the full refundable credit.
label: {ja: 政府案（2029年度からの本格版）, en: "Government plan (full version, from FY2029)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "2029年度から本格的に始まる支給。所得が中くらい以下の働く人に、前の年の所得と子どもの数に応じた額を年1回支給する。勤労所得、合計所得、払っている税金と保険料、配偶者の所得に条件がある。金額と条件の線引きはまだ決まっていない。"
  en: "From fiscal 2029, the full version of a payment to people in work on low or middle incomes, once a year, based on the previous year's income and the number of children. There are conditions on earned income, total income, the tax and insurance you pay, and your spouse's income. The amounts and limits haven't been decided."
summary:
  ja: "政府が2026年10月9日に国会に提出した法律案の内容です（2026年11月3日時点で衆議院で審議中）。就業者負担軽減支援金は2027年4月に始まり、2029年度から本格的な形になります。ここで「本格版」と呼んでいるのは、この2029年度からの形です。前の年の所得をもとに年1回支給します。2029年度分は、本格版の額の半年分程度です。これとは別に2029年4月に、2028年度に支給を受けた人へ、本格版の額の半年分程度が先に支給されます（法律案では2028年度分への上乗せ）。支給額の形は2026年9月15日の大綱によるもので、勤労所得が一定額を超えると支給が始まり、低い所得では定額、そこから稼ぎが増えるにつれて支給額も増え、上限に達したあとは所得が一定額を超えると減っていきます。子ども1人ごとに上乗せがあります。対象になるのは、勤労所得が一定額を超え、合計所得が一定額以下で、払っている税金と社会保険料（受け取る公的年金を差し引いた額）が一定額を超える人です。結婚している人は、配偶者の前の年の合計所得が一定額を超えると対象になりません。自営業の人も、一定額を超える事業の所得は勤労所得に数えます。その年の1月1日に日本に住所がない人には支給されません（国籍による条件は書かれていません）。働いていない高齢者と、勤労所得が最低額に届かない人は対象外で、政府はそれぞれへの対応を別に決めるとしています。壁が解消されるまでの時限的な措置として、会社の保険に入って保険料を払うようになった人のうち、勤労所得が「年収の壁」で減った手取りが元に戻る水準までの人には、上乗せ（就業促進特例加算）もあります（大綱9ページ。国民健康保険と国民年金に入る人も対象かは、はっきりしていません）。金額や収入の線引きは、法律案では後で政令で決めることになっていて、まだ決まっていません。"
  en: "This is the content of a bill the government submitted to the Diet on 9 October 2026 (still being debated in the House of Representatives on 3 November 2026). The worker burden-relief payment starts in April 2027 and takes its full form from fiscal 2029; \"full version\" on this site means that form. It is paid once a year, based on the previous year's income. The fiscal 2029 payment is about half of the full-version amount. Separately, in April 2029, people who received the fiscal 2028 payment get about half of the full-version amount in advance (in the bill, an addition to the fiscal 2028 payment). The shape of the payment comes from the Cabinet outline of 15 September 2026: payment starts once earned income passes a minimum; it is a flat amount at low incomes, grows as earnings grow, levels off, and then shrinks once total income passes a set level. There is extra for each child. To qualify, earned income must be above a set level, total income at or below a set level, and the tax and social insurance you pay, minus any public pension you receive, above a set level. A married person does not qualify if their spouse's total income in the previous year is above a set level. For the self-employed, business income above a set amount counts as earned income. People with no address in Japan on 1 January of the year are not paid (no nationality condition is written). Older people who don't work, and people whose earned income is below the minimum, are not covered; the government says it will decide separately how to respond for each. Until the income walls (年収の壁) are removed, there is also a temporary top-up (就業促進特例加算) for people who start paying company insurance premiums and whose earned income is below the level where the take-home pay lost at the wall is regained (outline, page 9; it is unclear whether people who move into National Health Insurance and National Pension also qualify). Under the bill, the amounts and income limits will be set later by Cabinet order; they haven't been decided."
start_year: 2029  # 令和11年度 (fiscal year from April 2029); payment is based on the previous year's income
status: unresolved

