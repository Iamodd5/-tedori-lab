# Government design for the full system from FY2029 (令和11年度).
# Chosen by the project owner: the Aug 5, 2026 Cabinet decision,
# detailed where needed by the Jul 29 interim summary, the Sep 15 Cabinet outline and the Oct 9 bill summary.
# The vehicle is the 就業者負担軽減支援金 (worker burden-relief payment). Its full-system form starts FY2029.
# Every yen amount and rate is left by the bill to a Cabinet order (政令), so none are published yet.
name_ja: 就業者負担軽減支援金（支援金制度の本格導入、令和11年度〜）
name_en: Worker burden-relief payment (full system, FY2029 onward)
# The outline calls the payment "本格的な「給付付き税額控除」を導入する第一歩" (outline p.1); the name follows the documents' own
# term for FY2029, "支援金制度の本格導入", and does not call it the full refundable credit.
label: {ja: 政府案（2029年度から）, en: "Government plan (from FY2029)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "2029年度からの形の支給（政府は「本格導入」としている）。所得が中くらい以下の働く人に、前の年の所得と子どもの数に応じた額を年度ごとに支給する。勤労所得、合計所得、払っている税金と保険料、配偶者の所得に条件がある。金額と条件の線引きはまだ決まっていない。"
  en: "From fiscal 2029, the form of the payment the government calls its full introduction: paid each fiscal year to people in work on low or middle incomes, based on the previous year's income and the number of children. There are conditions on earned income, total income, the tax and insurance you pay, and your spouse's income. The amounts and limits haven't been decided."
summary:
  ja: "政府が2026年10月9日に国会に提出した法律案の内容です（2026年11月3日時点で衆議院で審議中）。就業者負担軽減支援金は2027年4月に始まり、2029年度からこの形になります（政府はこれを「本格導入」としています）。前の年の所得をもとに年度ごとに支給します。2029年度分は、この形の額の半年分程度です。これとは別に2029年4月に、2028年度に支給を受けた人へ、この形の額の半年分程度が先に支給されます（法律案では2028年度分への上乗せ）。支給額の形は2026年9月15日の大綱によるもので、勤労所得が一定額を超えると支給が始まり、低い所得では定額、そこから稼ぎが増えるにつれて支給額も増え、上限に達したあとは所得が一定額を超えると減っていきます。子ども1人ごとに上乗せがあります。対象になるのは、勤労所得が一定額を超え、合計所得が一定額以下で、払っている税金と社会保険料（受け取る公的年金を差し引いた額）が一定額を超える人です。結婚している人は、配偶者の前の年の合計所得が一定額を超えると対象になりません。自営業の人も、一定額を超える事業の所得は勤労所得に数えます。その年の1月1日に日本に住所がない人には支給されません（国籍による条件は書かれていません）。働いていない高齢者と、勤労所得が最低額に届かない人は対象外です。法律案は、対象にならない所得の低い働く人や、病気や障害などで働くことが難しい人への支援のあり方を検討して2028年度中に結論を出し、必要があると認めるときは2029年度以降に措置を講ずること、働いていない高齢者などへの支援のあり方を検討して次の年金の財政検証の翌年までに結論を出すことを定めています（第36条第4項・第5項）。いわゆる「年収の壁」に直面する人と、同じ程度の社会保険料を負担する人には、大綱が「「年収の壁」が解消するまでの時限的な措置」とする上乗せ（就業促進特例加算）もあります。大綱は「年収の壁」を、会社の保険に入ること、または国民健康保険・国民年金に入ることで保険料の負担が増えることとし、上乗せの対象を、勤労所得がパートが会社の保険に入る線（年収106万円）から、壁で減った手取りが元に戻る水準までの人としています。扶養されていた配偶者が年収130万円で国民年金の第1号被保険者になる例では、手取りが戻るのは年収約160万円です（大綱9〜10ページ）。細かい条件と金額はまだ決まっていません。費用は国が3分の2以上を負担し、国の分の財源は、赤字国債（特例公債）に頼らず歳出・歳入全般の見直しで確保するとしています（第21条、第39条）。支給の総額の見込みは、まだ示されていません。金額や収入の線引きは、法律案では後で政令で決めることになっていて、まだ決まっていません。"
  en: "This is the content of a bill the government submitted to the Diet on 9 October 2026 (still being debated in the House of Representatives on 3 November 2026). The worker burden-relief payment starts in April 2027 and takes this form from fiscal 2029 (the government calls it the full introduction). It is paid each fiscal year, based on the previous year's income. The fiscal 2029 payment is about half of this form's amount. Separately, in April 2029, people who received the fiscal 2028 payment get about half of this form's amount in advance (in the bill, an addition to the fiscal 2028 payment). The shape of the payment comes from the Cabinet outline of 15 September 2026: payment starts once earned income passes a minimum; it is a flat amount at low incomes, grows as earnings grow, levels off, and then shrinks once total income passes a set level. There is extra for each child. To qualify, earned income must be above a set level, total income at or below a set level, and the tax and social insurance you pay, minus any public pension you receive, above a set level. A married person does not qualify if their spouse's total income in the previous year is above a set level. For the self-employed, business income above a set amount counts as earned income. People with no address in Japan on 1 January of the year are not paid (no nationality condition is written). Older people who don't work, and people whose earned income is below the minimum, are not covered. The bill says the government will consider support for low earners left out and for people who find it hard to work because of illness or disability, reach a conclusion during fiscal 2028 and, if it finds it necessary, take measures from fiscal 2029; and that it will consider support for older people who don't work and reach a conclusion by the year after the next public pension review (article 36, paragraphs 4 and 5). People facing an income wall (年収の壁), and people with a similar insurance burden, also get a top-up (就業促進特例加算) that the outline calls temporary until the walls are removed. The outline defines the wall as the extra premiums of joining company insurance or of moving into National Health Insurance and National Pension, and covers earned income from the line where part-timers join company insurance (¥1.06m a year) up to where the take-home pay lost at the wall is regained. In its example, a dependent spouse who reaches ¥1.3m and moves into National Pension regains take-home pay at about ¥1.6m (outline, pages 9–10). The detailed conditions and the amount haven't been decided. The national government pays at least two-thirds of the cost, and its share is to be financed without deficit-covering bonds, by reviewing spending and revenue as a whole (articles 21 and 39). No estimate of the total cost has been published. Under the bill, the amounts and income limits will be set later by Cabinet order; they haven't been decided."
start_year: 2029  # 令和11年度 (fiscal year from April 2029); payment is based on the previous year's income
status: unresolved

