not_eligible_named_by_government:  # PM press-conference points (参考資料２, 2026-08-05) p.3 (対象外となる方)
  - "勤労意欲のある低所得の方 (low-income people willing to work but below the earnings floor) — response to be decided before FY2029"
  - "就労しておられない高齢者の方 (older people not in work) — to be decided by 2030 alongside the pension reform"

notes: >
  The Cabinet decision and the bill fix who is eligible and the shape of the payment, but every amount,
  threshold and rate is to be set later by Cabinet order (政令で定める額; bill summary p.1). The documents give
  reference points only, which are NOT used as parameters: candidate earned-income floors discussed by the
  council (salary ~1.06m / 0.74m / ~0.53m; interim image p.2), the single-person resident-tax exemption line
  (salary 1.19m; outline p.9), and that phase-out ends at around 50% of average pay in other countries
  (interim image p.2). Until the order is published, this design is shown as "incomplete parameters".
