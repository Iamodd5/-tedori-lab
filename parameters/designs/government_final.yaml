parameters:
  # --- Structure (what the documents do fix) ---
  unit:
    value: individual  # 個人単位; single people included
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)"}
  earned_income_definition:
    value: "Earned income (勤労所得) = amount computed from previous-year salary income + business and work-related miscellaneous income above a set amount"
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)①"}
  income_test_definition:
    value: "Upper eligibility limit and phase-out use previous-year 合計所得金額 (total income)"
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)②, 2(1)⑤"}
  child_age_limit:
    value: 18  # 扶養児童 = dependants who are residents and under 19 (i.e. 18 or younger)
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)②"}
  shape:
    value: "flat below phase-in start → rises at a fixed rate → flat basic amount → (plus child add-on per child, plus temporary 'income wall' add-on) → falls at a fixed rate above phase-out start"
    status: resolved
    cite: {source: outline, page: 8, section: "第三 一 2(1)①-⑤"}
  rounding:
    value: 1000  # 1,000-yen units, rounded up (端数切上げ)
    status: resolved
    cite: {source: outline, page: 10, section: "第三 一 2(1)⑥"}
  payments_per_year:
    value: 1
    status: resolved
    cite: {source: outline, page: 11, section: "第三 一 3(7)"}
  taxable:
    value: false  # 租税その他の公課は課することができない
    status: resolved
    cite: {source: outline, page: 12, section: "第三 一 3(9)"}

  # --- Amounts and thresholds (all left to a Cabinet order; none published) ---
  earned_income_floor:          # 所得下限額
    value: null
    status: unresolved
    question: Q9
  income_ceiling:               # 所得上限額 (varies with number of children)
    value: null
    status: unresolved
    question: Q9
  net_burden_threshold:         # 純負担基準額 (tax + social insurance − public pension income must exceed this)
    value: null
    status: unresolved
    question: Q9
  spouse_income_ceiling:        # 配偶者所得上限額
    value: null
    status: unresolved
    question: Q9
  flat_amount_low_income:       # 定額支援額 (earned income ≤ phase-in start)
    value: null
    status: unresolved
    question: Q9
  phase_in_start:               # 逓増開始額 (based on resident-tax income-levy exemption line; single person: income 450,000 / salary 1.19m — reference only)
    value: null
    status: unresolved
    question: Q9
  phase_in_rate:
    value: null
    status: unresolved
    question: Q9
  phase_in_end:                 # 逓増終了額
    value: null
    status: unresolved
    question: Q9
  basic_amount:                 # 支援基本額
    value: null
    status: unresolved
    question: Q9
  child_addition_per_child:     # こども加算
    value: null
    status: unresolved
    question: Q9
  income_wall_addition:         # 就業促進特例加算 (temporary; earned income from ~1.06m salary line up to where take-home recovers)
    value: null
    status: unresolved
    question: Q9
  phase_out_start:              # 逓減開始額
    value: null
    status: unresolved
    question: Q9
  phase_out_rate:               # 逓減率
    value: null
    status: unresolved
    question: Q9

notes: >
  The Cabinet decision and the bill fix who is eligible and the shape of the payment, but every amount,
  threshold and rate is to be set later by Cabinet order (政令で定める額; bill summary p.1). The documents give
  reference points only, which are NOT used as parameters: candidate earned-income floors discussed by the
  council (salary ~1.06m / 0.74m / ~0.53m; interim image p.2), the single-person resident-tax exemption line
  (salary 1.19m; outline p.9), and that phase-out ends at around 50% of average pay in other countries
  (interim image p.2). Until the order is published, this design is shown as "incomplete parameters".
