    text: "（ニ）その者が当該年度の初日の属する年の一月一日（以下「基準日」という。 ）現在において配偶者を有していた場合にあっては、当該配偶者の前年の合計所得金額が政令で定める額以下であること。"
    source: bill_outline
    page: 2
  - claim: {ja: "事業所得と、仕事による雑所得（業務に係る雑所得）も、合わせて一定額を超えるときは、勤労所得に加えます。", en: "Business income and miscellaneous income from work (業務に係る雑所得) are also added to earned income when together they are above a set amount."}
    text: "事業所得又は雑所得を生ずべき業務に係る雑所得を有する場合（当該事業所得の金額及び当該雑所得の金額の合計額が政令で定める額を超える場合に限る。 ）には、当該合計額を加算して得た額とする。"
    source: bill_outline
    page: 2
  - claim: &m11 {ja: "その年度が始まる年の1月1日に日本国内に住所がない人には支給されません。", en: "People with no address in Japan on 1 January of the year in which the fiscal year starts are not paid."}
    text: "当該年度の初日の属する年の一月一日（以下「基準日」という。 ）"
    source: bill_outline
    page: 2
  - claim: *m11
    text: "就業者負担軽減支援金は、イの者が基準日現在において日本国内に住所を有しないときは、支給しない。"
    source: bill_outline
    page: 3
  - claim: {ja: "勤労所得が一定額を超えない人は対象外です。", en: "People whose earned income is not above a set minimum are not covered."}
    text: "①勤労所得※1 の額が政令で定める額超"
    source: bill_summary
    page: 1
  - claim: {ja: "政府は、働いていない高齢者も「対象外となる方」に挙げています（2026年7月30日の総理会見のポイント）。", en: "The government also lists older people who don't work among the people not covered (points from the Prime Minister's press conference of 30 July 2026)."}
    text: "（対象外となる方） – 勤労意欲のある低所得の方：給付の対象外で支援が必要な方を丁寧に把握した上で、既存の社会保障制度での対応も含め、必要な対応の在り方を検討し、可能なものについては令和11年度からに合わせて実施できるよう、本格導入までに結論を得る – 就労しておられない高齢者の方"
    source: pm_points
    page: 3
  - claim: &m13 {ja: "法律案は、この支援金の対象にならない所得の低い働く人や、病気などで働くことが難しい人への必要な措置のあり方を検討して2028年度中に結論を出し、必要があると認めるときは2029年度以降に措置を講ずること、働いていない高齢者などがこの支援金と今の社会保障制度の両方から取り残されないよう、必要な措置のあり方を検討して、次の年金の財政検証が作られる年の翌年までに結論を出すことを定めています（第36条第4項・第5項）。", en: "The bill says the government will consider what measures are needed for low earners left out of this payment and for people who find it hard to work because of illness or other reasons, reach a conclusion during fiscal 2028 and, if it finds it necessary, take measures from fiscal 2029; and that it will consider what measures are needed so that older people who don't work and others are not left out of both this payment and the existing social security system, and reach a conclusion by the year after the next public pension review (財政検証) is produced (article 36, paragraphs 4 and 5)."}
    text: "政府は、低所得の就業者及び疾病等により就業が困難である者のうち 就業者負担軽減支援金に係る制度の対象とならないものに対する必要な措置の在り方について、生活困窮者の自立支援に関する制度等の既存の社会保障制度との関係を整理しつつ、給付並びに相談支援及び就業支援を一体的に実施することを含め、その実施に要する財源の確保と併せて検討を行い、令和十年度中に結論を得て、必要があると認めるときは、令和十一年度以降所要の措置を講ずるものとする。"
    source: bill_outline
    page: 6
  - claim: *m13
    text: "（第三十六条第四項関係）"
    source: bill_outline
    page: 6
  - claim: *m13
    text: "政府は、就業していない高齢者等が就業者負担軽減支援金に係る制度及び既存の社会保障制度の双方から取り残されることのないよう、年金制度及び生活保護制度その他の既存の社会保障制度との関係を整理しつつ、必要な措置の在り方について検討を行い、次期財政検証が作成される年の翌年までに結論を得るものとする。 （第三十六条第五項関係）"
    source: bill_outline
    page: 6
  - claim: &m14 {ja: "いわゆる「年収の壁」に直面する人と、同じ程度の社会保険料を負担する人には、大綱が「「年収の壁」が解消するまでの時限的な措置」とする上乗せ（就業促進特例加算）もあります。", en: "People facing an income wall (年収の壁), and people with a similar insurance burden, also get a top-up (就業促進特例加算) that the outline calls temporary until the walls are removed."}
    text: "いわゆる「年収の壁」（※１）に直面する者及び同程度の社会保険料負担のある者に対しては、第四「検討等」の四 6 の取組により「年収の壁」が解消するまでの時限的な措置として"
    source: outline
    page: 9
  - claim: *m14
    text: "就業を特に促進するための加算 （以下 「就業促進特例加算」 という。 ） を支給する。"
    source: outline
    page: 9
  - claim: &m15 {ja: "大綱は「年収の壁」を、会社の保険に入ること、または国民健康保険・国民年金に入ることで保険料の負担が増えることとし、上乗せの対象を、勤労所得がパートが会社の保険に入る線（大綱の換算で年収106万円）から、壁で減った手取りが元に戻る水準までで、会社の保険に入ると生じる保険料に当たる額を払った人としています。", en: "The outline defines the wall as the extra premiums of joining company insurance or of moving into National Health Insurance and National Pension, and covers people whose earned income is between the line where part-timers join company insurance (¥1.06m of pay a year in the outline's conversion) and the level where the take-home pay lost at the wall is regained, and who paid premiums equal to those of company insurance."}
    text: "（※１）被用者保険が適用されること又は国民健康保険の被保険者・国民年金第１号被保険者となることによって生じる社会保険料負担の増加をいう。"
    source: outline
    page: 9
  - claim: *m15
    text: "就業促進特例加算は、勤労所得が被用者保険の短時間労働者の適用ライン（※２）から「年収の壁」による可処分所得の減少が回復する水準までであって、被用者保険の適用に伴い生じる社会保険料相当額を支払った者を対象とする。"
    source: outline
    page: 9
  - claim: *m15
    text: "険の短時間労働者の適用労働時間（週 20 時間）を乗じて、年間の収入（所得）に換算すると、給与収入 106 万円"
    source: outline
    page: 10
  - claim: {ja: "大綱の例では、扶養されている配偶者（国民年金の第3号被保険者）が年収130万円になり国民年金の第1号被保険者になった場合、税と社会保険料を引いた手取りが元に戻るのは年収約160万円程度です（大綱9〜10ページ）。", en: "In the outline's example, a dependent spouse (a category 3 member of National Pension) who reaches ¥1.3m a year and becomes a category 1 member of National Pension regains take-home pay, after tax and social insurance, at about ¥1.6m a year (outline, pages 9–10)."}
    text: "国民年金第３号被保険者が年収 130 万円になり、国民年金第 1 号被保険者になった場合、税・社会保険料負担を差し引いた手取りが回復する水準は年収約 160 万円程度。"
    source: outline
    page: 10
  - claim: {ja: "大綱は、上乗せの額を、「年収の壁」に直面する人に手厚く支給することと、それ以外の人への支給を含めた全体のバランスなどを考えて決めるとしています。", en: "The outline says the top-up's amount will be set considering the overall balance between generous payments to people facing the wall and payments to everyone else, among other things."}
    text: "就業促進特例加算の額は、「年収の壁」に直面する方に手厚い給付を行うこととそれ以外の方に対する給付を含めた総合的なバランス等を勘案して定める。"
    source: outline
    page: 9
  - claim: &m18 {ja: "費用は国が3分の2以上を負担し、国の分の財源は、赤字国債（特例公債）に頼らず歳出・歳入全般の見直しで確保するとしています（第21条第1項、第39条第1項）。", en: "The national government pays at least two-thirds of the cost, and its share is to be financed without deficit-covering bonds, by reviewing spending and revenue as a whole (article 21, paragraph 1, and article 39, paragraph 1)."}
    text: "国がその三分の二以上で政令で定める割合を、 都道府県及び市町村 （特別区を含む。５（２）を除き、以下同じ。 ）がその余の割合の二分の一をそれぞれ負担する。 （第二十一条第一項関係）"
    source: bill_outline
    page: 5
  - claim: *m18
    text: "政府は、３（７）イにより国が負担する費用の財源については、特例公債に頼ることなく、補助金等及び租税特別措置の適正化その他の歳出及び歳入全般の見直しにより確保するものとする。 （第三十九条第一項関係）"
    source: bill_outline
    page: 7
  - claim: &m19 {ja: "法律案では、金額や条件の線引きは後で政令で決めることになっています。", en: "Under the bill, the amounts and the limits in the conditions will be set later by Cabinet order."}
    text: "前年所得額や 19 歳未満の居住扶養親族数（令和 9･10 年度は 16 歳未満の扶養親族数） ※2 に応じて政令で定める額とする。"
    source: bill_summary
    page: 1
  - claim: *m19
    text: "①勤労所得※1 の額が政令で定める額超  ②合計所得金額が政令で定める額以下"
    source: bill_summary
    page: 1
  - claim: *m19
    text: "③税・社会保険料負担額から公的年金等収入額を控除した額が政令で定める額超"
    source: bill_summary
    page: 1
  - claim: *m19
    text: "④配偶者の合計所得金額が政令で定める額以下"
    source: bill_summary
    page: 1

parameters:
  # --- Structure (what the documents do fix) ---
  unit:
    value: individual  # 個人単位; single people included
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)"}
  earned_income_definition:
    value: "Earned income (勤労所得) = amount computed from previous-year salary income + business and work-related miscellaneous income above a set amount"
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)①"}
  income_test_definition:
    value: "Upper eligibility limit and phase-out use previous-year 合計所得金額 (total income)"
    status: resolved
    cite: {source: outline, page: "7, 10", section: "第三 一 1(1)②, 2(1)⑤"}
  child_age_limit:
    value: 18  # 扶養児童 = dependants who are residents and under 19 (i.e. 18 or younger)
    status: resolved
    cite: {source: outline, page: 7, section: "第三 一 1(1)②"}
  shape:
    value: "flat below phase-in start → rises at a fixed rate → flat basic amount → (plus child add-on per child, plus temporary 'income wall' add-on) → falls at a fixed rate above phase-out start"
    status: resolved
    cite: {source: outline, page: "8-10", section: "第三 一 2(1)①-⑤"}
  rounding:
    value: 1000  # 1,000-yen units, rounded up (端数切上げ)
    status: resolved
    cite: {source: outline, page: 10, section: "第三 一 2(1)⑥"}
  payments_per_year:
    value: 1
    status: resolved
    cite: {source: outline, page: 11, section: "第三 一 3(7)"}
  taxable:
    value: false  # 租税その他の公課は課することができない
    status: resolved
    cite: {source: outline, page: 12, section: "第三 一 3(9)"}

