# Government design for the full system from FY2029 (令和11年度).
# Chosen by the human on 2026-10-30 (HUMAN_TODO H-3, option A): the Aug 5, 2026 Cabinet decision,
# detailed where needed by the Jul 29 interim summary, the Sep 15 Cabinet outline and the Oct 9 bill summary.
# The vehicle is the 就業者負担軽減支援金 (worker burden-relief payment). Its full-system form starts FY2029.
# Every yen amount and rate is left by the bill to a Cabinet order (政令), so none are published yet.
name_ja: 就業者負担軽減支援金（給付付き税額控除の本格導入、令和11年度〜）
name_en: Worker burden-relief payment (full refundable-credit system, FY2029 onward)
start_year: 2029  # 令和11年度 (fiscal year from April 2029); payment is based on the previous year's income
status: unresolved

