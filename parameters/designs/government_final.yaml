# Government design for the full system from FY2029 (令和11年度).
# Chosen by the project owner: the Aug 5, 2026 Cabinet decision,
# detailed where needed by the Jul 29 interim summary, the Sep 15 Cabinet outline and the Oct 9 bill summary.
# The vehicle is the 就業者負担軽減支援金 (worker burden-relief payment). Its full-system form starts FY2029.
# Every yen amount and rate is left by the bill to a Cabinet order (政令), so none are published yet.
name_ja: 就業者負担軽減支援金（支援金制度の本格導入、令和11年度〜）
name_en: Worker burden-relief payment (full system, FY2029 onward)
# The outline calls the payment "本格的な「給付付き税額控除」を導入する第一歩" (outline p.1); the name follows the documents' own
# term for FY2029, "支援金制度の本格導入", and does not call it the full refundable credit.
label: {ja: 政府案（2029年度から）, en: "Government plan (from FY2029)"}
# What the plan does, in one line and in one paragraph, for the website (from the sources above)
short:
  ja: "所得が中くらい以下の働く人に、就業者負担軽減支援金を年度ごとに支給します。これは2029年度からの形で、政府は「本格導入」としています。額は、前の年の所得と、扶養している、日本に住む19歳未満の親族の数に応じて決まります。支援金の対象になるのは、働いて得た所得が一定額を超え、すべての所得を合わせた額が一定額以下の人です。払っている税金と社会保険料の合計から、受け取っている公的年金などを引いた額が、一定額を超えることも条件です。配偶者がいる人は、配偶者のすべての所得を合わせた額が一定額以下であることも条件です。支給額と、条件の線引きとなる金額は、法律案では、後で政令（内閣が定める命令）で決めることになっています。"
  en: "People in work on low and middle incomes get the worker burden-relief payment each fiscal year. This is its form from fiscal 2029, which the government calls the full introduction. The amount is based on the previous year's income and the number of dependent relatives under 19 living in Japan. To get the payment, earned income must be above a set level and total income at or below a set level. The tax and social insurance you pay, minus any public pension you receive, must also be above a set level. If you have a spouse, the spouse's total income must be at or below a set level. Under the bill, the payment amounts and the levels used in the conditions will be set later by Cabinet order."
summary:
  ja: "2026年10月9日に閣議決定され、同じ日に国会に提出された法律案の内容です。衆議院は、2026年11月6日にこの法律案を可決しました（2026年11月13日に衆議院の議案審議経過情報で確認）。就業者負担軽減支援金は2027年4月に始まり、2029年度から、ここで説明する形になります。政府はこれを「本格導入」としています。支援金は、前の年の所得をもとに、年度ごとに支給します。対象になるのは、勤労所得（働いて得た所得）が一定額を超える人です。そのうえで、合計所得（すべての所得を合わせた額）が一定額以下であることが条件です。払っている税金と社会保険料の合計から、受け取っている公的年金などを引いた額が、一定額を超えることも条件です。その年度が始まる年の1月1日に配偶者がいる人は、配偶者の前の年の合計所得が一定額を超えると対象になりません。事業所得と、仕事による雑所得（業務に係る雑所得）も、合わせて一定額を超えるときは、勤労所得に加えます。その年度が始まる年の1月1日に日本国内に住所がない人には支給されません。勤労所得が一定額を超えない人は対象外です。政府は、働いていない高齢者も「対象外となる方」に挙げています（2026年7月30日の総理会見のポイント）。法律案は、政府が検討することも定めています。一つは、所得の低い働く人や、病気などで働くことが難しい人のうち、この支援金の対象にならない人への必要な措置のあり方です。2028年度中に結論を出し、必要があると認めるときは、2029年度以降に措置をとると定めています（第36条第4項）。もう一つは、働いていない高齢者などが、この支援金と今の社会保障制度の両方から取り残されないようにするために必要な措置のあり方です。こちらは、次の年金の財政検証が作られる年の翌年までに結論を出すと定めています（同じ条の第5項）。支給額の形は、政府が2026年9月15日に閣議決定した大綱（制度のあらましを定めた文書）によります。支援金は、勤労所得が一定額を超えると支給が始まります。勤労所得が低いうちは定額で、そこから勤労所得が増えるにつれて一定の割合で増え、そのあと定額になります。合計所得が一定額を超えると、一定の割合で減っていきます。日本に住む19歳未満の親族を扶養している人には、その人数に応じた定額の上乗せ（こども加算）があります。いわゆる「年収の壁」に直面する人と、同じ程度の社会保険料を負担する人には、上乗せ（就業促進特例加算）もあります。大綱はこの上乗せを、「年収の壁」が解消するまでの時限的な措置としています。大綱は「年収の壁」を、会社の保険に入ること、または国民健康保険と国民年金に入ることで、保険料の負担が増えることとしています。上乗せの対象になるのは、勤労所得が次の範囲にあり、会社の保険に入ると生じる保険料に当たる額を払った人です。範囲は、パートで働く人が会社の保険に入る線（大綱の換算で年収106万円）から、壁で減った手取りが元に戻る水準までです。大綱は、扶養されている配偶者（国民年金の第3号被保険者）が年収130万円になり、国民年金の第1号被保険者になる場合を例に挙げています。この例で、税と社会保険料を引いた手取りが元に戻るのは、年収約160万円です（大綱9〜10ページ）。大綱は、上乗せの額を、「年収の壁」に直面する人に手厚く支給することと、それ以外の人への支給を含めた全体のバランスなどを考えて決めるとしています。なお、2029年度分は、この形で計算した額の半年分を基本とした額です。これとは別に、2029年4月に、2028年度の支給の対象だった人へ、この形で計算した額の半年分を基本とした額を先に支給します。法律案では、これを2028年度分への上乗せとしています。法律案では、費用の3分の2以上を国が負担します（第21条第1項）。国の分の財源は、赤字国債（特例公債）に頼らず、歳出と歳入全般の見直しで確保するとしています（第39条第1項）。支給額と、条件の線引きとなる金額は、法律案では、後で政令（内閣が定める命令）で決めることになっています。政府は、市区町村が所得に応じて現金を支給する支援金制度を、本格的な給付付き税額控除への「第一歩」としています。"
  en: "This is the content of a bill that the Cabinet approved on 9 October 2026 and that was submitted to the Diet the same day. The House of Representatives passed the bill on 6 November 2026 (checked on the House's bill record on 13 November 2026). The worker burden-relief payment starts in April 2027 and takes the form described here from fiscal 2029. The government calls this the full introduction. It is paid each fiscal year, based on the previous year's income. To qualify, earned income must be above a set level. Total income must also be at or below a set level. The tax and social insurance you pay, minus any public pension you receive, must be above a set level as well. A person who has a spouse on 1 January of the year in which the fiscal year starts does not qualify if the spouse's total income in the previous year is above a set level. Business income and miscellaneous income from work (業務に係る雑所得) are also added to earned income when together they are above a set amount. People with no address in Japan on 1 January of the year in which the fiscal year starts are not paid. People whose earned income is not above a set minimum are not covered. The government also lists older people who don't work among the people not covered (points from the Prime Minister's press conference of 30 July 2026). The bill also names two questions for the government to consider. The first is what measures are needed for low earners, and people who find it hard to work because of illness or other reasons, who are left out of this payment. The government is to reach a conclusion during fiscal 2028 and, if it finds it necessary, take measures from fiscal 2029 (article 36, paragraph 4). The second is what measures are needed so that older people who don't work, and others, are not left out of both this payment and the existing social security system. Here the government is to reach a conclusion by the year after the next public pension review (財政検証) is produced (paragraph 5 of the same article). The shape of the payment comes from the outline that the Cabinet approved on 15 September 2026. Payment starts once earned income passes a minimum. It is a flat amount while earned income is low, grows at a fixed rate as earned income grows, and then stays flat. Once total income passes a set level, it shrinks at a fixed rate. People who support relatives under 19 living in Japan get a fixed extra amount (こども加算) that depends on how many there are. People facing an income wall (年収の壁), and people with a similar social insurance burden, also get a top-up (就業促進特例加算). The outline describes this top-up as a time-limited measure until the income wall is removed. The outline defines the wall as the extra premiums that come with joining company insurance, or with moving into National Health Insurance and National Pension. The top-up covers people whose earned income is in the following range and who paid premiums equal to those of company insurance. The range runs from the line where part-timers join company insurance (¥1.06m of pay a year in the outline's conversion) to the level where the take-home pay lost at the wall is regained. The outline gives the example of a dependent spouse (a category 3 member of National Pension) who reaches ¥1.3m a year and becomes a category 1 member of National Pension. In that example, take-home pay after tax and social insurance is regained at about ¥1.6m a year (outline, pages 9–10). The outline says the top-up's amount will be set considering the overall balance between generous payments to people facing the wall and payments to everyone else, among other things. The fiscal 2029 payment is an amount based on half of the amount worked out in this form. Separately, in April 2029, people eligible for the fiscal 2028 payment are paid in advance an amount based on half of the amount worked out in this form. In the bill, this is an addition to the fiscal 2028 payment. Under the bill, the national government pays at least two-thirds of the cost (article 21, paragraph 1). Its share is to be financed without deficit-covering bonds, by reviewing spending and revenue as a whole (article 39, paragraph 1). Under the bill, the payment amounts and the levels used in the conditions will be set later by Cabinet order. The government calls its payment scheme, in which municipalities pay cash according to income, a \"first step\" towards a full refundable tax credit."
start_year: 2029  # 令和11年度 (fiscal year from April 2029); payment is based on the previous year's income
status: unresolved

