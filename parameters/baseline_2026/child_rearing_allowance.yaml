    file: sources/law/jido_fuyo_teate_ho_336AC0000000238.xml
    published: 2025-06-01 (text in force; downloaded 2026-11-03)
  order:
    title: 児童扶養手当法施行令（令和8年政令第55号による改正後）
    url: https://laws.e-gov.go.jp/api/1/lawdata/336CO0000000405
    file: sources/law/jido_fuyo_teate_sekourei_336CO0000000405.xml
    published: 2026-04-01 (text in force; downloaded 2026-11-03)
  cfa:
    title: こども家庭庁 児童扶養手当制度の概要
    url: https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/71de338f-5ed2-4c95-9848-3fd387d0b4d7/a4e6f323/20260408_policies_hitori-oya_fuyou-teate_19.pdf
    file: sources/child/cfa_20260408_jido_fuyo_teate_gaiyou.pdf
