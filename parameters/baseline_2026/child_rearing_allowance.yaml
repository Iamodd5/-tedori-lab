child_age_max: {value: 18, cite: {source: act, page: 1, section: "3条1項 (18歳に達する日以後の最初の3月31日まで)"}, note: "ages are held fixed for the year, so a child counts while 18 or under"}
monthly:
  first_child: {value: 48050, cite: {source: order, page: 1, section: "2条の2第1項"}, note: "also cfa p.1 全部支給 48,050円"}
  each_further_child: {value: 11350, cite: {source: order, page: 1, section: "2条の2第2項"}}
income_test:  # 施行令4条1項: salary and public-pension income together less 100,000 (not below 0), then the total less 80,000
  salary_pension_deduction: {value: 100000, cite: {source: order, page: 1, section: "4条1項"}}
  fixed_deduction: {value: 80000, cite: {source: order, page: 1, section: "4条1項"}}
limits:  # 前年所得 at or above which payment is reduced (full) or stops (partial)
  full_base: {value: 690000, cite: {source: order, page: 1, section: "2条の4第1項第1号"}}
  partial_base: {value: 2080000, cite: {source: order, page: 1, section: "2条の4第2項第1号イ"}}
  per_dependant: {value: 380000, cite: {source: order, page: 1, section: "2条の4第1項第2号イ, 第2項第1号ロ(1)"}, note: "each dependant or supported child, other than below"}
  per_specific: {value: 530000, cite: {source: order, page: 1, section: "2条の4第1項第2号ハ"}, note: "特定扶養親族等: 特定扶養親族 and 控除対象扶養親族 under 19, i.e. dependants aged 16 to 22"}
withheld:  # 2条の4第3項・第4項: (income − full limit) × rate, rounded to 10 yen (under 5 down, 5 or more up), plus 10
  first_child_rate: {value: 0.0264029, cite: {source: order, page: 1, section: "2条の4第3項"}}
  further_child_rate: {value: 0.0040719, cite: {source: order, page: 1, section: "2条の4第4項"}}
  round_to: {value: 10, cite: {source: order, page: 1, section: "2条の4第3項"}}
  plus: {value: 10, cite: {source: order, page: 1, section: "2条の4第3項"}}
not_taxed: {value: true, cite: {source: act, page: 1, section: "25条 (公課の禁止)"}}
notes:
  approximation: true
  explanation: >
    The April 2026 amounts are used for all 12 months, and the test uses the same year's income (the law uses the
    previous year's income for November to October). The claimant is the mother, with no child support (養育費) and none of
    the 施行令4条2項 deductions; dependants aged 70+ and other household members' incomes are not tested.
  site:
    ja: （近似）ひとり親の児童扶養手当は、2026年4月からの額を1年分すべてに使い、その年の所得で判定しています（実際は前の年の所得で、11月から翌年10月までの額が決まります）。受け取るのは母親で、養育費は受け取っていないものとしています。
    en: (Approximation) The single-parent allowance (児童扶養手当) uses the amounts from April 2026 for all 12 months, judged on the same year's income (in fact, the previous year's income sets the amount from November to the next October). We assume the mother receives it and gets no child support payments.
