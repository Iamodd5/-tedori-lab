# Individual resident tax (特別区民税・都民税) charged on 2026 income (令和9年度分), Shinjuku ward.
# Employment income and the income definitions follow income tax (MIC note p.20: 給与所得控除 "所得税と同様の対応").
# Deduction amounts and limits are the 令和9年度 ones in the law as amended by 令和8年法律第2号 (OPEN_QUESTIONS Q13, answered 2026-11-03).
source:
  law:
    title: 地方税法（令和8年法律第2号による改正後、令和9年1月1日施行の条文。令和9年度分の個人住民税に適用）
    url: https://laws.e-gov.go.jp/api/2/law_data/325AC0000000226_20270101_508AC0000000002?law_full_text_format=xml&response_format=xml
    file: sources/law/chihozeiho_20270101.xml
    published: 2026-03-31
  income_tax_law:
    title: 所得税法（令和8年法律第12号による改正後、令和8年12月1日施行の条文）
    url: https://laws.e-gov.go.jp/law/340AC0000000033
    file: sources/law/shotokuzeiho_20261201.xml
    published: 2026-03-31
  ota_deductions:
    title: 大田区 所得控除（住民税）
    url: https://www.city.ota.tokyo.jp/seikatsu/zeikin/kazei/shotokukojyo.html
    file: sources/tax/ota_shotokukojo.html
    published: 2026-08-31
  ota_example:
    title: 大田区 住民税の計算のしくみ（計算例）
    url: https://www.city.ota.tokyo.jp/seikatsu/zeikin/kazei/keisannosikumi.html
    file: sources/tax/ota_keisan_no_shikumi.html
    published: 2026-10-27
  mic:
    title: 個人住民税の基礎控除等について（総務省 自治税務局 市町村税課 資料３）
    url: https://www.soumu.go.jp/main_content/001075462.pdf
    file: sources/tax/soumu_kojin_juminzei_kiso_kojo_r8.pdf
    published: 2026-05-29
  shinjuku_tax:
    title: 新宿区 住民税について（住民税が課税されない方）
    url: https://www.city.shinjuku.lg.jp/hoken/file04_03_00001.html
