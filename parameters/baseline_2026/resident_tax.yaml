  mic_general:
    title: 総務省 個人住民税
    url: https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/150790_06.html
    file: sources/tax/soumu_kojin_juminzei.html
    published: 2026 (page as downloaded 2026-10-29)

employment_income_same_as_income_tax: {value: true, cite: {source: mic, page: 20}}
basic_deduction:
  amount: {value: 430000, cite: {source: law, page: 1, section: "314条の2第2項第1号"}, note: "最高43万円, unchanged for 令和9年度 (Chuo, Adachi)"}
  taper:
    bands: [[24000000, 430000], [24500000, 290000], [25000000, 150000]]
    above: 0
    cite: {source: law, page: 1, section: "314条の2第2項第1号〜第3号"}
personal_deductions:  # 令和9年度 amounts from the law as amended (Q13 answered 2026-11-03); none changed except the two limits below
  spouse: {value: 330000, cite: {source: law, page: 1, section: "314条の2第1項第10号イ(1)"}}
  elderly_spouse: {value: 380000, cite: {source: law, page: 1, section: "314条の2第1項第10号イ(2) (earner ≤ 9m)"}}
  dependent_general_16_plus: {value: 330000, cite: {source: law, page: 1, section: "314条の2第1項第11号"}}
  dependent_specific_19_to_22: {value: 450000, cite: {source: law, page: 1, section: "314条の2第1項第11号"}}
  single_parent: {value: 300000, cite: {source: law, page: 1, section: "314条の2第1項第8号の2"}, note: "33万 only from 令和10年度 (MIC p.35)"}
  working_student: {value: 260000, cite: {source: law, page: 1, section: "314条の2第1項第9号"}}
  working_student_income_limit: {value: 890000, cite: {source: income_tax_law, page: 1, section: "所得税法2条1項32号 (令和8年分), applied by 地方税法314条の2第9項 and 292条5項"}}
  elderly_spouse_age_from: {value: 70, cite: {source: law, page: 1, section: "314条の2第1項第10号イ (老人控除対象配偶者)"}}
  dependent_general_age_from: {value: 16, cite: {source: law, page: 1, section: "314条の2第1項第11号"}}
  dependent_specific_age_from: {value: 19, cite: {source: law, page: 1, section: "314条の2第1項第11号"}}
  dependent_specific_age_under: {value: 23, cite: {source: law, page: 1, section: "314条の2第1項第11号"}}
  spouse_earner_income_limit: {value: 10000000, cite: {source: law, page: 1, section: "292条1項8号"}, note: "earner above this: no spouse deduction"}
  spouse_earner_full_limit: {value: 9000000, cite: {source: law, page: 1, section: "314条の2第1項第10号イ"}, note: "earner ≤ 9m column; above it the spouse special deduction and spouse 差 are not counted here (Q37)"}
  dependant_income_limit: {value: 620000, cite: {source: law, page: 1, section: "292条1項7号・9号 (令和8年法律第2号; 附則11条2項: 令和9年度分から)"}, note: "also MIC p.35: 改正前58万円 → 改正後62万円"}
  spouse_special:  # spouse income above 620,000 (upper inclusive) -> amount, earner total income ≤ 9m column
    bands: [[1000000, 330000], [1050000, 310000], [1100000, 260000], [1150000, 210000], [1200000, 160000], [1250000, 110000], [1300000, 60000], [1330000, 30000]]
    cite: {source: ota_deductions, page: 1, section: "配偶者特別控除額（令和9年度以降）; law 314条の2第1項第10号の2"}
  specific_relative_special:  # 特定親族特別控除: relatives 19-22 with income above 620,000 up to 1,230,000 (upper inclusive) -> amount
    bands: [[950000, 450000], [1000000, 410000], [1050000, 310000], [1100000, 210000], [1150000, 110000], [1200000, 60000], [1230000, 30000]]
    cite: {source: ota_deductions, page: 1, section: "特定親族特別控除額（令和9年度以降）; law 314条の2第1項第12号"}
personal_deduction_difference:  # 人的控除額の差 used for the 調整控除 tax credit (no entry for 特定親族特別控除)
  basic: {value: 50000, cite: {source: law, page: 1, section: "314条の6第1号イ"}}
  spouse: {value: 50000, cite: {source: law, page: 1, section: "314条の6第1号イ表(6)(i) (earner ≤ 9m)"}}
  elderly_spouse: {value: 100000, cite: {source: law, page: 1, section: "314条の6第1号イ表(6)(ii) (earner ≤ 9m)"}}
  dependent_general: {value: 50000, cite: {source: law, page: 1, section: "314条の6第1号イ表(8)(i)"}}
  dependent_specific: {value: 180000, cite: {source: law, page: 1, section: "314条の6第1号イ表(8)(ii)"}}
  single_parent_mother: {value: 50000, cite: {source: law, page: 1, section: "314条の6第1号イ表(4)"}}
  working_student: {value: 10000, cite: {source: law, page: 1, section: "314条の6第1号イ表(5)"}}
adjustment_credit:  # 調整控除: rate × min(差, taxable) if taxable ≤ 2m; else rate × max(差 - (taxable - 2m), 50,000)
  rate:
    ward: {value: 0.03, cite: {source: law, page: 1, section: "314条の6第1号・第2号"}}
    tokyo: {value: 0.02, cite: {source: law, page: 1, section: "37条第1号・第2号"}}
  threshold: {value: 2000000, cite: {source: law, page: 1, section: "314条の6第1号・第2号"}}
  minimum_base: {value: 50000, cite: {source: law, page: 1, section: "314条の6第2号"}}
  income_limit: {value: 25000000, cite: {source: law, page: 1, section: "314条の6"}}
income_levy_rate:  # 特別区民税 and 都民税 are worked out and rounded separately (rounding below)
  ward: {value: 0.06, cite: {source: law, page: 1, section: "314条の3第1項 (1条2項: 市町村 = 特別区)"}}
  tokyo: {value: 0.04, cite: {source: law, page: 1, section: "35条第1項 (1条2項: 道府県 = 都)"}}
per_capita_levy:  # 均等割: ward 3,000 + Tokyo 1,000, plus national forest environment tax 1,000
  ward: {value: 3000, cite: {source: shinjuku_r7, page: 1}}
  tokyo: {value: 1000, cite: {source: shinjuku_r7, page: 1}}
  forest_environment_tax: {value: 1000, cite: {source: shinjuku_r7, page: 1}}
non_taxable:  # Shinjuku, from 令和3年度. No levy if total income ≤ per_person × (N + 1) + add (single person: ≤ single)
  # N = number of same-household spouse and dependants (incl. under 16)
  per_person: {value: 350000, cite: {source: shinjuku_tax, page: 1}}
  per_capita_add: {value: 310000, cite: {source: shinjuku_tax, page: 1}}
  income_levy_add: {value: 420000, cite: {source: shinjuku_tax, page: 1}}
  single: {value: 450000, cite: {source: shinjuku_tax, page: 1}}
  single_parent_none_if_total_income_le: {value: 1350000, cite: {source: shinjuku_tax, page: 1}}
relief_band:  # just above the income-levy line, the income levy is at most the excess of total income over the line
  value: "income levy <= total income - income-levy line (non_taxable, income_levy_add)"
  cite: {source: mic, page: 18, section: "（参考）非課税限度額（所得割）のイメージ — 負担調整措置"}
  note: "地方税法附則3条の3第2項・第5項 (sources/law/chihozeiho_20270101.xml): each tax's income levy is cut by the excess × its share, then each is rounded. MIC's figure (line 1,120,000; income 1,124,200) shows the same amount before rounding, 4,200 (OPEN_QUESTIONS Q22)."
rounding:  # Q14 answered 2026-11-03. 第8項 joins the two taxes only when a whole amount is under 100 yen.
  taxable_income: {value: 1000, note: "round down", cite: {source: law, page: 1, section: "20条の4の2第1項"}}
  income_levy: {value: 100, note: "round down, separately for 特別区民税 and 都民税", cite: {source: law, page: 1, section: "20条の4の2第3項・第8項"}}
  example: {cite: {source: ota_example, page: 1, section: "特別区民税 201,540 → 201,500; 都民税 133,360 → 133,300"}}
