# Long-term-care insurance premiums for people aged 65 and over (介護保険 第1号被保険者), Shinjuku, fiscal 2026. OPEN_QUESTIONS Q15.
# Hand calculation: tests/hand_calcs/H6.md (revision 2026-11-03).
source:
  shinjuku:
    title: 新宿区 介護保険料の決まり方（65歳以上（第1号被保険者）の方の介護保険料（令和8年度））
    url: https://www.city.shinjuku.lg.jp/fukushi/file07_02_00006.html
