  base_deduction: {value: 430000, cite: {source: nhi, page: 1}}
  medical: {per_member: 47600, rate: 0.0751, cap: 670000, cite: {source: nhi, page: 1}}
  support: {per_member: 17600, rate: 0.0280, cap: 260000, cite: {source: nhi, page: 1}}
  ltc_40_64: {per_member: 17800, rate: 0.0243, cap: 170000, age_from: 40, age_to_exclusive: 65, cite: {source: nhi, page: 1}}
