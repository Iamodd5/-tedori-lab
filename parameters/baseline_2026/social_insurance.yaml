  preschool_flat_reduction: {value: 0.5, cite: {source: nhi, page: 1}}
  flat_reduction:  # household 総所得金額等 ≤ limit -> reduce per-member amounts
    base: {value: 430000, cite: {source: nhi_reduction, page: 1}}
    per_extra_earner: {value: 100000, cite: {source: nhi_reduction, page: 1}}
    seventy_percent: {per_member_add: 0, share: 0.7, cite: {source: nhi_reduction, page: 1}}
    fifty_percent: {per_member_add: 310000, share: 0.5, cite: {source: nhi_reduction, page: 1}}
    twenty_percent: {per_member_add: 570000, share: 0.2, cite: {source: nhi_reduction, page: 1}}
    pensioner_65_extra_deduction: {value: 150000, age_from: 65, cite: {source: nhi_reduction, page: 1}}

notes:
  approximation: true
  site:
    ja: （近似）健康保険・子ども・子育て支援金・厚生年金の保険料率は2026年3月か4月から、雇用保険料率は4月から変わりますが、2026年の12か月すべてに新しい率を使っています。国民年金は2026年度の月額を全月に使っています。国民健康保険は2026年度の新宿区の料率を使っています（2026年の収入に本来かかる2027年度の料率はまだ公表されていません）。給与は毎月同じ額で、ボーナスはないものとしています。
    en: (Approximation) Rates for health insurance, the child and childcare support levy and employee pension change in March or April 2026, and employment insurance in April. We use the new rates for all 12 months of 2026. National Pension uses the fiscal 2026 monthly amount for every month. National Health Insurance uses Shinjuku's fiscal 2026 rates, because the fiscal 2027 rates (which would apply to 2026 income) aren't published yet. Pay is the same every month, with no bonus.
  explanation: >
    Health, child-support levy and pension rates start March/April 2026 and employment
    insurance April 2026; we apply them to all 12 months of 2026. National pension uses the FY2026 amount for all
    months. NHI uses FY2026 Shinjuku rates applied to 2026 income (FY2027 rates are not published). Salary is
    treated as 12 equal monthly payments with no bonus.
