notes:
  approximation: true
  site:
    ja: （近似）健康保険・介護保険の保険料率は2026年3月分から、雇用保険料率は4月から変わり、子ども・子育て支援金は4月分から新しく始まります（厚生年金の保険料率18.3%は変わりません）。計算では、2026年の12か月すべてに新しい率と支援金を使っています。国民年金は2026年度の月額を全月に使っています。国民健康保険は2026年度の新宿区の料率を使っています（2026年の収入に本来かかる2027年度の料率はまだ公表されていません）。給与は毎月同じ額で、ボーナスはないものとしています。
    en: (Approximation) Health and long-term care insurance rates change from March 2026 and employment insurance from April; the child and childcare support levy is new from April (the employee pension rate, 18.3%, does not change). We use the new rates and the levy for all 12 months of 2026. National Pension uses the fiscal 2026 monthly amount for every month. National Health Insurance uses Shinjuku's fiscal 2026 rates, because the fiscal 2027 rates (which would apply to 2026 income) aren't published yet. Pay is the same every month, with no bonus.
  explanation: >
    Health and LTC rates start March 2026 (協会けんぽ table: 令和8年3月分～), the child-support levy is new from April 2026
    (令和8年4月分～), the pension rate is unchanged since September 2017 (平成29年9月分～), and employment
    insurance April 2026; we apply them to all 12 months of 2026. National pension uses the FY2026 amount for all
    months. NHI uses FY2026 Shinjuku rates applied to 2026 income (FY2027 rates are not published). Salary is
    treated as 12 equal monthly payments with no bonus.
