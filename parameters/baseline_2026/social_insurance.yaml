employee:
  premium_table: {value: kyoukaikenpo_tokyo_r8.csv, cite: {source: kyoukai, page: 1}, note: "employee half; health_ltc_half for ages 40-64; pension grades 4-35 only (below grade 4 uses grade 4, above 35 uses 35)"}
  rounding:
    value: "employee half: 0.50 yen or less rounds down, over 0.50 rounds up; health and child levy rounded separately"
    cite: {source: kyoukai, page: 1, section: "注①"}
    approximation: true
    explanation: "MHLW/こども家庭庁 子ども・子育て支援金Q&A (2026-02-12) Q6 rounds the employee half once on the combined rate; that Q&A has been withdrawn (404). Open: Q38"
    site:
      ja: （近似）会社の健康保険料と子ども・子育て支援金の本人負担分は、それぞれ1円未満を丸めています。国の説明資料（2026年2月）は合計してから丸めるとしていましたが、その資料はいまは公開されていません。差は月1円以内です。
      en: (Approximation) We round the employee's share of health insurance and of the child and childcare support levy separately to the yen. A government Q&A (February 2026) said to round them once, together, but it is no longer published. The difference is at most ¥1 a month.
  employment_insurance_worker_rate: {value: 0.005, cite: {source: koyo, page: 1, section: "一般の事業"}}
  ltc_age_from: {value: 40, cite: {source: kyoukai, page: 1}}
  ltc_age_to_exclusive: {value: 65, cite: {source: kyoukai, page: 1}}
  pension_age_to_exclusive: {value: 70, cite: {source: kyoukai, page: 1}, note: "厚生年金 to age 70"}

part_time_coverage:  # 短時間労働者: employer 51+ staff (until Sep 2027), ≥20 h/week, not a student, monthly wage ≥ 88,000 (see note)
  employer_size_min: {value: 51, cite: {source: coverage, page: 1}}
  hours_min: {value: 20, cite: {source: coverage, page: 1}}
  monthly_wage_min:
    value: 88000
    cite: {source: coverage, page: 1}
    note: >
      Applied to all 12 months of 2026. January–September: the wage test itself (it was abolished from 2026-10-01:
      wage_test_end, wage_test_end_notice). October–December: a short-time worker paid under 88,000 a month with a
      最低賃金法7条 exception is a 特定減額特例対象者 and is not insured unless they ask to join (kousei_law 附則4条の6第1項・第2項;
      kenko_law 附則8条の3の2第1項・第2項). At 20 hours a week the lowest minimum wage in force from October to December
      2026, 1,023 yen (minimum_wage: 高知・宮崎・沖縄 before their new rates start), pays 1,023 × 20 × 52 ÷ 12 = 88,660 a month,
      so on 20+ hours anyone paid under 88,000 can only be such a worker. Hand calculation: tests/hand_calcs/wall_H1.md, revision 2.
    approximation: true
    explanation: "From October, people paid under 88,000 a month on 20+ hours are taken not to ask to join company insurance (the legal default)."
    site:
      ja: （近似）2026年10月からは、週20時間以上働いて月給が8.8万円未満の人は、最低賃金の減額特例を受けている人だけです。どの地域の最低賃金でも、週20時間なら月8.8万円を超えるためです。この人たちは、自分で申し出ないかぎり会社の保険に入りません。計算では、申し出はしないものとしています。
      en: (Approximation) From October 2026, the only people working 20+ hours a week for under ¥88,000 a month are workers with a minimum-wage exception (at every regional minimum wage, 20 hours a week pays more than ¥88,000 a month). They join company insurance only if they ask; we assume they don't.
  students_excluded: {value: true, cite: {source: coverage, page: 1}}
  employment_insurance:  # 雇用保険: 20+ hours a week, expected 31+ days, not a daytime student; no pay or employer-size condition
    note: "Charged to every wage earner on 20+ hours who is not a student, in or out of company insurance (OPEN_QUESTIONS Q24, answered 2026-11-03)"
    cite: {source: koyo_law, page: 1, section: "雇用保険法6条1号・2号・4号"}

health_dependant_income_limit:  # annual income below this
  general: {value: 1300000, cite: {source: dependant, page: 1}}
  age_19_to_22_not_spouse: {value: 1500000, age_from: 19, age_under: 23, cite: {source: dependant, page: 1}}
  age_60_plus: {value: 1800000, age_from: 60, cite: {source: dependant, page: 1}}

national_pension_monthly: {value: 17920, cite: {source: kokumin, page: 1}, note: "FY2026"}
student_deferral:  # 学生納付特例 (国民年金法90条の3): only while the student's own income is at most the limit. OPEN_QUESTIONS Q39
  income_limit: {value: 1280000, cite: {source: kokumin_order, page: 1, section: "6条の9 (no dependants)"}}
  working_student_deduction: {value: 270000, cite: {source: kokumin_order, page: 1, section: "6条の12第2項第2号"}}
  note: "Income = 総所得金額 less the social-insurance deduction (6条の12第2項第1号) and, for a working student, 270,000. Hand calculation: tests/hand_calcs/H2.md"
  approximation: true
  site:
    ja: （近似）学生の国民年金保険料の納付猶予（学生納付特例）は、その年の所得で判定しています。実際は、前の年の所得で判定します。
    en: (Approximation) Whether a student may put off National Pension payments (the student deferral) is judged on the same year's income (in fact, the previous year's).
national_pension_ages:  # 第1号被保険者: 「二十歳以上六十歳未満」 (Q30 answered 2026-11-03)
  from: {value: 20, cite: {source: kokumin_law, page: 1, section: "国民年金法7条1項1号"}}
  to_exclusive: {value: 60, cite: {source: kokumin_law, page: 1, section: "国民年金法7条1項1号"}}

