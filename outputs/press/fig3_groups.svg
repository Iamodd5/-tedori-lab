<text x="24.0" y="404.0" font-size="11" fill="#4E5B70" text-anchor="start" font-weight="normal">大和総研の計算式を2026年の制度に当てはめた計算で、大和総研自身の試算とは異なります。</text>
<text x="24.0" y="420.0" font-size="11" fill="#4E5B70" text-anchor="start" font-weight="normal">どの案も入れる前の制度と比べた平均です。どのグループにも、変わらない世帯や、平均と逆に動く世帯があります。</text>
<text x="24.0" y="436.0" font-size="11" fill="#4E5B70" text-anchor="start" font-weight="normal">（近似）2024年の国の調査の平均に合わせた架空の世帯による大まかな試算。働き方は変わらないものとしています</text>
