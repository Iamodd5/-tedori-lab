  what:
    ja: 「検証」ページで、公開されている計算ツール（OpenFisca-Japan）の住民税がこのサイトより低い理由は「まだ分かっていない」としていましたが、理由が分かり、比較のしかたを直しました。比較表のOpenFisca-Japan側の数字が変わりました。
    en: The Checks page said we hadn't found why an open calculator (OpenFisca-Japan) gives lower resident tax. We found the reason and corrected the comparison; OpenFisca-Japan's numbers in the table changed.
  why:
    ja: OpenFisca-Japanは、指定しないかぎり全員が国民年金保険料を払うものとして計算します。会社員について指定していなかったため、払っていない保険料21万120円を所得から差し引いていました。会社員は払わないと指定すると、残る違いはすべて理由が分かります（2025年以前の控除額、調整控除の最低額がないことなど）。
    en: OpenFisca-Japan assumes everyone pays National Pension unless told otherwise. The comparison didn't say employees don't, so it took ¥210,120 of premiums they don't pay off their income. With that set, every remaining difference has a known reason (deduction amounts from 2025 and earlier, no minimum in the adjustment credit, and so on).
