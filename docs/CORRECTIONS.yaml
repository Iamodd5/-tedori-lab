  what:
    ja: 例の世帯H1の名前を「単身・パート（130万円の壁付近）」から「単身・パート（年収125万円）」に変えました。数字は変わりません。
    en: Renamed example household H1 from "Single part-time employee near the 1.3m wall" to "Single part-time employee (¥1.25m a year)". No numbers changed.
  why:
    ja: H1は一人暮らしで、だれの扶養にも入っていないため、「130万円の壁」（扶養から外れて自分で保険料を払い始める境目）は当てはまりません。前の名前は誤解を招くものでした。
    en: H1 lives alone and is nobody's dependant, so the "¥1.3m wall" (where a dependant starts paying their own insurance premiums) does not apply to H1. The old name was misleading.
