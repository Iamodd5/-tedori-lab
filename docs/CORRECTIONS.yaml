    en: Cabinet Order No. 275 of 2026 ended the pay condition from 1 October 2026 (Japan Pension Service notice of 1 October 2026).
  later:
    ja: この修正の10〜12月の部分は、同じ日の再確認で取り消しました（上の記録）。
    en: The October–December part of this fix was withdrawn after a recheck the same day (entry above).
