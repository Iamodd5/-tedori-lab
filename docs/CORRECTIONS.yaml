- date: 2026-11-04
  previous: 8efa8b5
  published: 263b817
  what:
    ja: 全世帯の試算で、配偶者やほかの大人の家族のうちだれが働くかの決め方を変えました。大和総研案の国全体の金額と、収入グループごとの手取りの平均の変化が変わりました。
    en: Changed how the all-household estimate decides which spouses and other adults work. The Daiwa plan's national totals and the average change for each income group changed.
  why:
    ja: 前の決め方では、大人の子どもや親族の全員に、調査の「その他の家族の収入」を均等に分けていたため、年収100万円以下で働く人が1,528万人と、公式の数（途中で働いた人を含めて約969万人）の1.6倍になっていました。また、働く配偶者が少なすぎ、その人たちに世帯の収入がほぼすべて集まっていました。いまは、調査の「働いている人の数」に合わせて、働く人と働かない人に分けています。
    en: The old way gave every adult child and relative an equal share of the survey's "other family members' earnings", which made 15.28 million earners at ¥1m or less, 1.6 times the official count including part-year workers (about 9.69 million). It also left too few working spouses, who took almost all of their household's pay. Now the survey's number of workers decides who works and who doesn't.
