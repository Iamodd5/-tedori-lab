# Corrections log (spec section 10, page 8), shown on site/corrections.html. Newest first.
# Every change to a published number or statement because it was wrong or misleading. Wording changes that keep
# the same facts and numbers are not listed.
# previous: the last published commit with the old version. published: the first published commit with the new
# one (left out until it is pushed). Either version can be rebuilt with `git checkout <commit> && make all`.
# A number with `check` is recomputed from those two commits by tests/test_corrections.py.
- date: 2026-11-02
  previous: 4e1c6be
  what:
    ja: 「検証」ページで、公開されている計算ツール（OpenFisca-Japan）の住民税は「1.7万〜2万円低い」と書いていました。正しくは、住民税を一人あたり定額の分（均等割）より多く払う4人について、12,982〜19,937円低い（およそ1.3万〜2万円）です。
    en: The Checks page said that an open calculator (OpenFisca-Japan) gives resident tax "¥17,000–20,000 lower". For the four people who pay more than the flat per-person part of resident tax, it is ¥12,982–19,937 lower (about ¥13,000–20,000).
  why:
    ja: 書いていた範囲には、例の世帯H8の収入の多い方（12,982円低い）が入っていませんでした。いまはこの範囲を、比べた表と同じ出力ファイルから自動で表示しています。
    en: The range left out the higher earner in example household H8, whose resident tax is ¥12,982 lower. The page now takes the range from the same output file as the comparison table.
- date: 2026-11-01
  previous: 89f1614
  published: 306c688
  what:
    ja: 例の世帯H4（会社員とパートの夫婦）で、パートの配偶者の年収が129万円から130万円に増えたときの手取りの減り方を直しました。
    en: Corrected how much take-home pay example household H4 (an employee and a part-time spouse) loses when the spouse's pay goes from ¥1.29m to ¥1.30m a year.
  why:
    ja: 扶養から外れた配偶者は国民年金保険料を払います。以前はこの保険料を配偶者本人の所得から差し引いていましたが、配偶者の所得は少ないため、税はほとんど減りませんでした。法律（所得税法74条）では、同じ世帯の夫または妻のために払った保険料を差し引けるので、収入の多い方が差し引くように直しました。これは近似です。
    en: A spouse who stops being a dependant pays National Pension premiums. We used to deduct them from the spouse's own income, which is small, so they saved almost no tax. The law (Income Tax Act article 74) lets a person deduct premiums paid for a spouse in the same household, so the higher earner now deducts them. This is an approximation.
  numbers:
