  what:
    ja: 例の世帯H1の名前を「単身・パート（130万円の壁付近）」から「単身・パート（年収125万円）」に変えました。数字は変わりません。
    en: Renamed example household H1 from "Single part-time employee near the 1.3m wall" to "Single part-time employee (¥1.25m a year)". No numbers changed.
  why:
    ja: H1は一人暮らしで、だれの扶養にも入っていないため、「130万円の壁」（扶養から外れて自分で保険料を払い始める境目）は当てはまりません。前の名前は誤解を招くものでした。
    en: H1 lives alone and is nobody's dependant, so the "¥1.3m wall" (where a dependant starts paying their own insurance premiums) does not apply to H1. The old name was misleading.
- date: 2026-11-01
  previous: 89f1614
  published: 306c688
  what:
    ja: 連合案をまだ計算できない理由を、「連合の案の資料をまだ入手できていません」から「連合が消費税還付制度の金額をまだ公表していません」に直しました。
    en: Changed the reason the Rengo plan can't be calculated yet, from "we haven't been able to get Rengo's proposal documents" to "Rengo hasn't published the amounts for its consumption tax refund".
  why:
    ja: 連合のウェブサイトの別のページで資料が見つかりました。資料には、案の一部である消費税還付制度の金額が書かれていないため、案はまだ計算できません。
    en: We found the documents on other pages of Rengo's website. They give no amounts for the consumption tax refund, which is part of the plan, so the plan still can't be calculated.
