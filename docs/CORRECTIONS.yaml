# Corrections log (spec section 10, page 8), shown on site/corrections.html. Newest first.
# Every change to a published number or statement because it was wrong or misleading. Wording changes that keep
# the same facts and numbers are not listed.
# previous: the last published commit with the old version. published: the first published commit with the new
# one (left out until it is pushed). Either version can be rebuilt with `git checkout <commit> && make all`.
# A number with `check` is recomputed from those two commits by tests/test_corrections.py.
- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 住民税の100円未満の切り捨てを、特別区民税と都民税のそれぞれで行うように直しました。例の世帯H3、H5、H8の手取りが年100円増え、いくつかの壁の金額が100円変わりました。「（近似）住民税の端数は一般的な方法で切り捨て」という注意書きは、法律で確かめたため外しました。
    en: Resident tax is now rounded down to the nearest ¥100 separately for the ward tax and the Tokyo tax. Take-home pay for example households H3, H5 and H8 goes up by ¥100 a year, and some walls change by ¥100. The note "(Approximation) resident tax rounded by the common method" is gone, because the rule is now checked against the law.
  why:
    ja: 地方税法20条の4の2第3項では、税ごとに100円未満を切り捨てます。以前は、二つの税を合わせた10%を一度に切り捨てていました。大田区の計算例も税ごとに切り捨てています。（模擬の閲覧者によるレビューで指摘）
    en: Under the Local Tax Act (article 20-4-2, paragraph 3), each tax is rounded down to ¥100 on its own. We used to round the combined 10% once. Ota City's worked example also rounds each tax. (Found by the simulated-visitor review.)
