  what:
    ja: 例の世帯H4（会社員とパートの夫婦）で、パートの配偶者の年収が129万円から130万円に増えたときの手取りの減り方を直しました。
    en: Corrected how much take-home pay example household H4 (an employee and a part-time spouse) loses when the spouse's pay goes from ¥1.29m to ¥1.30m a year.
  why:
    ja: 扶養から外れた配偶者は国民年金保険料を払います。以前はこの保険料を配偶者本人の所得から差し引いていましたが、配偶者の所得は少ないため、税はほとんど減りませんでした。法律（所得税法74条）では、同じ世帯の夫または妻のために払った保険料を差し引けるので、収入の多い方が差し引くように直しました。これは近似です。
    en: A spouse who stops being a dependant pays National Pension premiums. We used to deduct them from the spouse's own income, which is small, so they saved almost no tax. The law (Income Tax Act article 74) lets a person deduct premiums paid for a spouse in the same household, so the higher earner now deducts them. This is an approximation.
