- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 2026年の収入にかかる住民税（令和9年度分）の、配偶者・扶養親族の所得の条件を58万円から62万円に、勤労学生の所得の条件を75万円から89万円に直し、19〜22歳の親族の特定親族特別控除を加えました。例の世帯H2（大学生）の年収150万円の壁が小さくなり、別に163万円の壁が分かれて出ます。「（近似）住民税の控除額は新宿区の2025年度分の案内から」という注意書きは外しました。
    en: For resident tax on 2026 income (fiscal 2027), the income limit for a spouse or dependant goes from ¥580,000 to ¥620,000 and for a working student from ¥750,000 to ¥890,000, and the special deduction for relatives aged 19 to 22 is added. Example household H2's (a university student) wall at ¥1.5m is smaller, and a separate wall at ¥1.63m appears. The note "(Approximation) resident tax deductions from Shinjuku's fiscal 2025 guide" is gone.
  why:
    ja: 令和9年度分の金額は、2026年3月に改正された地方税法（令和8年法律第2号）ですでに決まっていました。以前は古い案内の金額を使っていました。（模擬の閲覧者によるレビューで指摘）
    en: The fiscal 2027 amounts were already set by the Local Tax Act as amended in March 2026; we were using an older guide. (Found by the simulated-visitor review.)
