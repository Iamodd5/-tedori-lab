  what:
    ja: 国民健康保険料の軽減で、世帯の「給与所得者等」に数える人を、政令のとおりにしました（給与収入55万円超、または年金収入60万円超、65歳以上は125万円超）。例の世帯H6（年金生活の夫婦）の国民健康保険料による3つの壁が、10万円低い年金の位置に移りました（178万→168万円、240万→230万円、292万→282万円）。このうち2つは大きさも変わりました（28,201→28,301円、15,188→16,088円）。所得税による655万円の壁は動いていません。今の収入での手取りは変わりません。
    en: For the National Health Insurance reduction, who counts as an earner in the household now follows the Cabinet order (salary over ¥550,000, or a pension over ¥600,000 for people under 65 and over ¥1.25m at 65 or over). Example household H6's (a pensioner couple) three walls caused by National Health Insurance move to pensions ¥100,000 lower (¥1.78m → ¥1.68m, ¥2.40m → ¥2.30m, ¥2.92m → ¥2.82m), and two of them change size (¥28,201 → ¥28,301, ¥15,188 → ¥16,088). The income-tax wall at ¥6.55m doesn't move. Take-home pay at their current income doesn't change.
  why:
    ja: 以前は、収入が少しでもある人をすべて数えていました。国民健康保険法施行令29条の7第6項第1号と附則5条では、年金80万円の配偶者（72歳）は数えません。
    en: We used to count everyone with any income. Under the National Health Insurance Act Enforcement Order (article 29-7, paragraph 6, item 1, and supplementary article 5), the 72-year-old spouse with a ¥800,000 pension does not count.
