- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 政府案の説明で、就業者負担軽減支援金が「2029年度から始まる」と書いていました。正しくは2027年4月に始まり、2029年度から本格的な形になります。あわせて、2029年度だけは半年分程度ずつ2回支給すること、結婚している人には配偶者の所得の条件があること、「年収の壁」で手取りが減る人への時限的な上乗せ（就業促進特例加算）があること、所得に応じた支給であること、国会で審議中の法律案であることを書き加えました。英語の説明で、2027〜28年度の支給の上限を「食料品の消費税の1%」としていたのも直しました（正しくは、1%に下げた後の食料品の消費税の税収見込みの範囲内）。
    en: The government plans' descriptions said the worker burden-relief payment "starts in fiscal 2029". It starts in April 2027 and takes its full form from fiscal 2029. We also added that fiscal 2029 has two payments of about half a year each, that married people face a test of their spouse's income, that there is a temporary top-up for people whose take-home pay falls at an income wall (就業促進特例加算), that the payment depends on income, and that the plan is a bill still before the Diet. The English text also gave the 2027–28 payments' cap as "1% of the consumption tax on food"; it is the expected revenue from the remaining 1% consumption tax on food.
  why:
    ja: 大綱（2026年9月15日）13ページ「支援金制度は、令和９年４月から導入する。」、9ページ（就業促進特例加算）、10〜11ページ（2029年度の2回の支給）、法律案の概要（2026年10月9日）の4つの条件に合わせました。上乗せを書いていなかったことは政府案に不利に、配偶者の所得の条件を書いていなかったことは政府案に有利に読めるものでした。
    en: To match the Cabinet outline of 15 September 2026 (page 13 on the April 2027 start, page 9 on the top-up, pages 10–11 on fiscal 2029) and the four conditions in the bill summary of 9 October 2026. Leaving out the top-up could be read as less favourable to the government plans, and leaving out the spouse test as more favourable.
  later:
    ja: 2029年度の2回の支給の書き方と、2027〜28年度の支給の上限の書き方は、再確認でさらに直しました（上の記録）。
    en: The wording on the two fiscal 2029 payments and on the 2027–28 limit was corrected again after a recheck (entry above).
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: ホームとレポートの最初の文で、どの案も「働く人の負担を軽くする案」だと事実として書いていました。どの案も所得の低い（または中くらいの）働く人の負担を軽くすることを目的に掲げているが、世帯によって手取りが増える場合も減る場合もある、と直しました。あわせて、このサイトが「4つの案を計算している」と読める文を、いま計算できるのは1つだけだと分かる文に直しました。
    en: The first sentence on Home and in the report stated as fact that the plans lower working people's tax and social insurance. It now says each plan aims to lighten the burden on people in work on low (or middle) incomes, but that take-home pay can go up or down depending on the household. A sentence that read as if the site calculates all four plans now says that only one can be calculated so far.
  why:
    ja: 計算できる唯一の案では、8つの例の世帯のうち4世帯の手取りが減り、国の収入は増えます。最初の文が案の側の言い方をそのまま使っていたためです。
    en: Under the one plan that can be calculated, 4 of the 8 example households take home less and the government takes in more. The first sentence had used the proposers' own framing.
  later:
    ja: この文は、再確認でさらに直しました（上の記録）。
    en: This sentence was corrected again after a recheck (entry above).
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 「計算方法」のページで、連合案を計算しない理由を「連合の資料をまだ入手できていないため」と書いていました。正しくは、資料は入手済みで、消費税還付制度の金額が公表されていないためです。同じページの、大和総研案で現金で戻る上限に数える保険料も「健康保険と厚生年金だけ」と書いていましたが、会社の保険に入っていない働く人は国民健康保険と国民年金を数えています（計算はもともとこのとおりです）。
    en: The How it works page said the Rengo plan isn't calculated because "we haven't been able to get Rengo's documents". We have them; the reason is that the amounts of its consumption tax refund aren't published. The Japanese version of the same page said the Daiwa plan's cash cap counts only health insurance and employee pension (「健康保険と厚生年金だけ」); for workers outside company insurance it counts National Health Insurance and National Pension (the calculation always did this).
  why:
    ja: 2026年11月1日にほかのページを直したとき、この2か所を直し忘れていました。
    en: These two places were missed when the other pages were corrected on 1 November 2026.
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 「検証」ページのくわしい表で、例の世帯H4の130万円の壁を古い数字（手取り−281,926円、元に戻る年収1,650,000円）のまま載せていました。ほかのページと同じ−258,226円、1,640,000円に直しました（実効限界負担率も2,919%から2,682%に）。同じ表の、大和総研が使った2025年の基礎控除を「58万円」としていたのも、68万円に直しました。
    en: 'The detailed tables on the Checks page still showed old figures for example household H4''s ¥1.3m wall (take-home −¥281,926, back at ¥1,650,000). They now match the other pages: −¥258,226 and ¥1,640,000 (and the effective marginal rate 2,919% → 2,682%). The same tables gave the 2025 basic deduction Daiwa used as ¥580,000; it is ¥680,000.'
  why:
    ja: このページの表は手で書いていて、2026年11月1日の修正のときに直し忘れていました。このため、公開したときから、ほかのページと合っていませんでした。基礎控除は、年収500万円の会社員（所得356万円）では68万円です（国税庁No.1199）。
    en: These tables are written by hand and were missed in the correction of 1 November 2026, so they never matched the other pages while published. For an employee on ¥5m (income ¥3.56m) the 2025 basic deduction is ¥680,000 (National Tax Agency No.1199).
