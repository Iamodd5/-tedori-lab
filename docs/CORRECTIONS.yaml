- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 全世帯の試算と比べる「公式の数字」の税額は、実際に集めた税収ではなく、2024年の調査が回答された収入から推計した税額です。「税収」と書いていた所を直しました。年収100万円以下で働く人の比較には、途中で働き始めた・辞めた人の数（約598万人）も加えました。国全体の金額は、0.01兆円単位から0.1兆円単位にしました。
    en: The tax figures we compare the all-household estimate with are not tax actually collected; they are the 2024 survey's own estimate of tax from reported incomes. Where we wrote "tax collected", that is fixed. The comparison of people earning ¥1m or less now also counts people who worked only part of the year (about 5.98 million). National totals are now shown to the nearest ¥0.1 trillion, not ¥0.01 trillion.
  why:
    ja: 推計税額は試算と同じ表から取っているため、独立した確かめではありません。また1年を通して働いた人だけと比べると、試算の多すぎる度合いが約4倍に見えますが、同じ定義で比べると約1.6倍です。0.01兆円の精度はこの試算にはありません。（模擬の閲覧者によるレビューで指摘）
    en: The estimated tax comes from the same table as the model, so it isn't an independent check. Comparing only with full-year workers made the model look about 4 times too high; like for like it is about 1.6 times. The estimate isn't accurate to ¥0.01 trillion. (Found by the simulated-visitor review.)
- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 年収の壁のグラフと一覧の説明を直しました。小さく手取りが減るところの理由を、どの世帯にも「会社の保険料が段階ごとに上がるため」と書いていましたが、会社の保険に入っていない世帯もあるので、一般的な説明にしました。一覧の壁が「10万円増えたら」のグラフで0円より下に出ないことがある理由（グラフは10万円ごと）を書き、収入0円からの変化をグラフからも外しました。「元の手取りに戻るには年収○円まで働く必要があります」は、1万円きざみで計算した値だと分かるように直しました。
    en: The explanations of the income-wall charts and list are corrected. The reason given for small dips, "company insurance premiums go up in steps", was shown for every household, including those not in company insurance; it is now general. We now say why a listed wall may not go below ¥0 on the "earn ¥100,000 more" chart (that chart moves in ¥100,000 steps), and the step from an income of 0 is left out of the chart as it already was from the list. "The spouse has to earn ¥X to get back" now says it is worked out in ¥10,000 steps.
  why:
    ja: 一覧とグラフで、壁の数え方が違って見えていました。（模擬の閲覧者によるレビューで指摘）
    en: The list and the charts seemed to disagree about the walls. (Found by the simulated-visitor review.)
- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 保険料率の注意書きで、厚生年金の料率が2026年に変わると読める書き方と、子ども・子育て支援金を料率の変更と書いていたのを直しました。厚生年金の料率18.3%は変わらず、子ども・子育て支援金は2026年4月分から新しく始まりました。
    en: The note on premium rates read as if the employee pension rate changed in 2026, and called the child and childcare support levy a rate change. The employee pension rate (18.3%) didn't change, and the levy is new from April 2026.
  why:
    ja: 協会けんぽ東京支部の保険料額表に「厚生年金保険料率：平成29年9月分～適用」「子ども・子育て支援金率：令和8年4月分（5月納付分）～適用」とあります。（模擬の閲覧者によるレビューで指摘）
    en: The Japan Health Insurance Association's Tokyo premium table says the pension rate has applied since September 2017 and the levy from April 2026. (Found by the simulated-visitor review.)
- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 「計算方法」のページに「ページに直接書いた数字はない」とありましたが、「検証」ページには手で書いた数字がありました。そう分かるように直し、手で書いた数字を出力ファイルと比べるテストを加えました。
    en: The How it works page said no number is typed into a page, but the Checks page had hand-written numbers. It now says so, and a test compares those numbers with the output files.
  why:
    ja: 手で書いた数字が古いまま残っていました（このページの別の記録を参照）。（模擬の閲覧者によるレビューで指摘）
    en: Hand-written numbers had gone out of date (see the other entries on this page). (Found by the simulated-visitor review.)
- date: 2026-11-02
  previous: 4e1c6be
  what:
    ja: 「検証」ページで、公開されている計算ツール（OpenFisca-Japan）の住民税は「1.7万〜2万円低い」と書いていました。正しくは、住民税を一人あたり定額の分（均等割）より多く払う4人について、12,982〜19,937円低い（およそ1.3万〜2万円）でした（2026年11月3日の住民税の端数の修正の後は12,882〜19,937円）。
    en: The Checks page said that an open calculator (OpenFisca-Japan) gives resident tax "¥17,000–20,000 lower". For the four people who pay more than the flat per-person part of resident tax, it was ¥12,982–19,937 lower (about ¥13,000–20,000); after the resident-tax rounding correction of 3 November 2026 it is ¥12,882–19,937.
  why:
    ja: 書いていた範囲には、例の世帯H8の収入の多い方（12,982円低い）が入っていませんでした。いまはこの範囲を、比べた表と同じ出力ファイルから自動で表示しています。
    en: The range left out the higher earner in example household H8, whose resident tax is ¥12,982 lower. The page now takes the range from the same output file as the comparison table.
