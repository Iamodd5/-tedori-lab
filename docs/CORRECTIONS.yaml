  what:
    ja: パートの社会保険の「月給8.8万円以上」の条件を、今も続くものとして書き、2026年の12か月すべてに当てはめていました。この条件は2026年10月1日になくなったので、10〜12月は月給にかかわらず会社の保険に入るとして計算し直しました。例の世帯H1の年収105万6,000円未満と、全世帯の試算が変わりました。
    en: We described the ¥88,000-a-month condition for part-timers' social insurance as still in force and applied it to all 12 months of 2026. It ended on 1 October 2026, so October to December are now worked out with part-timers in company insurance whatever their pay. Example household H1 below ¥1,056,000 a year and the all-household estimate change.
