      before: 188563
      after: 212075
- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: パートの社会保険の計算を直しました。同じ日の修正で、2026年10月からは週20時間以上で働くパートは月給にかかわらず会社の保険に入るとしましたが、月給8.8万円未満の人は、1年を通して会社の保険に入らないものに戻しました。あわせて、雇用保険料を、会社の健康保険や厚生年金に入っていない人にもかけるようにしました（週20時間以上で働く学生でない人）。例の世帯H1の年収105万6,000円未満と、全世帯の試算が変わりました（グループ6〜9の平均の変化も、それぞれ年200円未満変わりました）。
    en: Corrected how part-timers' social insurance is worked out. The fix earlier the same day put part-timers working 20+ hours a week into company insurance from October 2026 whatever their pay; people paid under ¥88,000 a month are now again outside company insurance all year. Employment insurance is now also charged to people outside company health insurance and pension (non-students working 20+ hours a week). Example household H1 below ¥1,056,000 a year and the all-household estimate change (the average changes for groups 6–9 each move by less than ¥200 a year).
  why:
    ja: 週20時間働くと、2026年10〜12月に使われているどの地域の最低賃金でも月8.8万円を超えます（最も低い1,023円で月88,660円。厚生労働省「令和8年度地域別最低賃金 全国一覧」）。それより少ない月給で週20時間以上働けるのは、最低賃金の減額特例を受けている人だけで、この人たちは申し出ないかぎり会社の保険に入りません（厚生年金保険法附則4条の6、健康保険法附則8条の3の2）。申し出はしないものとして計算しています。雇用保険には給料の条件がありません（雇用保険法6条）。前の修正のままでは、10月から会社の保険に入る人の保険料が、大和総研案で現金が出る上限に数えられていませんでした。
    en: At 20 hours a week, every regional minimum wage in force from October to December 2026 pays more than ¥88,000 a month (the lowest, ¥1,023 an hour, gives ¥88,660; MHLW list of regional minimum wages for fiscal 2026). Only workers with a minimum-wage exception can work 20+ hours for less, and they join company insurance only if they ask (Employees' Pension Insurance Act supplementary article 4-6; Health Insurance Act supplementary article 8-3-2). We assume they don't ask. Employment insurance has no pay condition (Employment Insurance Act article 6). The earlier fix also left out the premiums of people joining in October from the Daiwa plan's cash cap.
