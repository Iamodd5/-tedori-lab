- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 全世帯の試算と比べる「公式の数字」の税額は、実際に集めた税収ではなく、2024年の調査が回答された収入から推計した税額です。「税収」と書いていた所を直しました。年収100万円以下で働く人の比較には、途中で働き始めた・辞めた人の数（約598万人）も加えました。ホーム、全世帯で見ると、レポートの国全体の金額は、0.01兆円単位から0.1兆円単位にしました（「検証」ページの表は0.01兆円単位のままです）。
    en: The tax figures we compare the all-household estimate with are not tax actually collected; they are the 2024 survey's own estimate of tax from reported incomes. Where we wrote "tax collected", that is fixed. The comparison of people earning ¥1m or less now also counts people who worked only part of the year (about 5.98 million). National totals on Home, All households and the report are now shown to the nearest ¥0.1 trillion, not ¥0.01 trillion (the Checks page tables keep ¥0.01 trillion).
  why:
    ja: 推計税額は試算と同じ表から取っているため、独立した確かめではありません。また1年を通して働いた人だけと比べると、試算の多すぎる度合いが約4倍に見えますが、同じ定義で比べると約1.6倍です。0.01兆円の精度はこの試算にはありません。
    en: The estimated tax comes from the same table as the model, so it isn't an independent check. Comparing only with full-year workers made the model look about 4 times too high; like for like it is about 1.6 times. The estimate isn't accurate to ¥0.01 trillion.
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 年収の壁のグラフと一覧の説明を直しました。小さく手取りが減るところの理由を、どの世帯にも「会社の保険料が段階ごとに上がるため」と書いていましたが、会社の保険に入っていない世帯もあるので、一般的な説明にしました。一覧の壁が「10万円増えたら」のグラフで0円より下に出ないことがある理由（グラフは10万円ごと）を書き、収入0円からの変化をグラフからも外しました。「元の手取りに戻るには年収○円まで働く必要があります」は、1万円きざみで計算した値だと分かるように直しました。
    en: The explanations of the income-wall charts and list are corrected. The reason given for small dips, "company insurance premiums go up in steps", was shown for every household, including those not in company insurance; it is now general. We now say why a listed wall may not go below ¥0 on the "earn ¥100,000 more" chart (that chart moves in ¥100,000 steps), and the step from an income of 0 is left out of the chart as it already was from the list. "The spouse has to earn ¥X to get back" now says it is worked out in ¥10,000 steps.
  why:
    ja: 一覧とグラフで、壁の数え方が違って見えていました。
    en: The list and the charts seemed to disagree about the walls.
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 保険料率の注意書きで、厚生年金の料率が2026年に変わると読める書き方と、子ども・子育て支援金を料率の変更と書いていたのを直しました。厚生年金の料率18.3%は変わらず、子ども・子育て支援金は2026年4月分から新しく始まりました。
    en: The note on premium rates read as if the employee pension rate changed in 2026, and called the child and childcare support levy a rate change. The employee pension rate (18.3%) didn't change, and the levy is new from April 2026.
  why:
    ja: 協会けんぽ東京支部の保険料額表に「厚生年金保険料率：平成29年9月分～適用」「子ども・子育て支援金率：令和8年4月分（5月納付分）～適用」とあります。
    en: The Japan Health Insurance Association's Tokyo premium table says the pension rate has applied since September 2017 and the levy from April 2026.
