  what:
    ja: 2026年の収入にかかる住民税（令和9年度分）の、配偶者・扶養親族の所得の条件を58万円から62万円に、勤労学生の所得の条件を75万円から89万円に直し、19〜22歳の親族の特定親族特別控除を加えました。例の世帯H2（大学生）の年収150万円の壁が小さくなり、別に163万円の壁が分かれて出ます。「（近似）住民税の控除額（配偶者控除・扶養控除など）は、新宿区の2025年度分の案内から取っています」という注意書きは外しました。例の世帯H3（世帯主の給与）とH4（配偶者の給与）では、133万〜136万円の4か所で手取りが年2,600円増えました。
    en: For resident tax on 2026 income (fiscal 2027), the income limit for a spouse or dependant goes from ¥580,000 to ¥620,000 and for a working student from ¥750,000 to ¥890,000, and the special deduction for relatives aged 19 to 22 is added. Example household H2's (a university student) wall at ¥1.5m is smaller, and a separate wall at ¥1.63m appears. The note "(Approximation) Resident tax deduction amounts (for a spouse, dependants and so on) are taken from Shinjuku's guide for fiscal 2025" is gone. For example households H3 (the head's pay) and H4 (the spouse's pay), take-home pay goes up by ¥2,600 a year at four points between ¥1.33m and ¥1.36m.
  why:
    ja: 令和9年度分の金額は、2026年3月に改正された地方税法（令和8年法律第2号）ですでに決まっていました。勤労学生の89万円は、所得税法の条件（令和8年法律第12号）を地方税法314条の2第9項で住民税にも使うものです。以前は古い案内の金額を使っていました。
    en: The fiscal 2027 amounts were already set by the Local Tax Act as amended in March 2026. The working-student limit of ¥890,000 is the income-tax limit (Income Tax Act as amended by Act No. 12 of 2026), which the Local Tax Act (article 314-2, paragraph 9) applies to resident tax. We were using an older guide.
