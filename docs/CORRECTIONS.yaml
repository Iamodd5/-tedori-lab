- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: 連合案の説明で、就労支援給付制度の財源1.5〜2兆円程度を「対象約600万人」としていました。連合の構想では、対象は給与収入65万〜250万円の雇われて働く人約2100万人で、約600万人は額が減っていく200万〜250万円の人の数です。
    en: The Rengo plan's description paired the work-support credit's cost of about ¥1.5–2 trillion with "about 6 million people". In Rengo's plan it is for about 21 million employees earning ¥650,000 to ¥2.5m; about 6 million is the number in the ¥2m–¥2.5m band where it shrinks.
  why:
    ja: 連合「税制改革構想」（改訂版、2025年5月28日）27ページの「雇用労働者（約2100万人）」「（対象者約600万人）」の読み違いです。
    en: A misreading of Rengo's Tax Reform Plan (revised, 28 May 2025), page 27, which gives about 21 million employees and, for the taper, about 6 million.
- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: 政府の2つの案の説明を直しました。2027〜28年度の支給の上限は「2年間の総額」ではなく、各年度の総額がその年度の1%分の飲食料品の消費税収（見込み）を超えないことを考慮して決めるものです。2029年4月の支給は、2028年度に支給を受けた人への先行分（法律案では2028年度分への上乗せ）で、2029年度分は本格版の半年分程度です。上乗せ（就業促進特例加算）の対象は、会社の保険に入って保険料を払うようになった人のうち、勤労所得が手取りの戻る水準までの人です。1月1日に日本に住所がない人は対象外であることと、短い説明に支給の条件があることも書き加えました。レポートの最初の段落でも、上乗せの対象と2029年度からの配偶者の所得の条件を書き加えました。
    en: Corrected the descriptions of the two government plans. The 2027–28 payments are not capped as "a two-year total"; each year's amounts are to be set taking into account that the year's total should not exceed that year's expected revenue from the remaining 1% consumption tax on food. The April 2029 payment is an advance to people who received the fiscal 2028 payment (in the bill, an addition to the fiscal 2028 payment), and the fiscal 2029 payment is about half of the full amount. The top-up (就業促進特例加算) is for people who start paying company insurance premiums and whose earned income is below the level where take-home pay recovers. We also added that people with no address in Japan on 1 January are not paid, and put the payment conditions into the one-line descriptions. The report's first section now also gives who the top-up is for and the spouse-income test from fiscal 2029.
  why:
    ja: 法律案の要綱（2026年10月9日）第十条第三項〜第五項、第九条第四項と、大綱（2026年9月15日）9〜11ページに合わせました。前の書き方は、上限を実際より強く、2029年4月の支給を受ける人をあいまいに、上乗せの対象を広く見せていました。レポートでは、上乗せは書いていたのに配偶者の所得の条件を書いていませんでした。
    en: To match the bill summary of 9 October 2026 (article 10, paragraphs 3–5; article 9, paragraph 4) and the Cabinet outline of 15 September 2026 (pages 9–11). The old wording made the limit sound firmer than it is, blurred who gets the April 2029 payment, and made the top-up sound wider than it is. The report gave the top-up but not the spouse-income test.
- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: ホームとレポートの最初の段落を直しました。前の文は「どの案も、所得の低い（または中くらいの）働く人の負担を軽くすることを目的に掲げていますが、世帯によって手取りが増える場合も減る場合もあります」で、計算できない案についても手取りが減る場合があると読めました。いまは、各案が目的を掲げていることと、いま計算できる一つの案で手取りが増える世帯も減る世帯もあることを分けて書いています。レポートの「いちばん伝えたいこと」の、大和総研案で「でも…減り（壁は残ります）」という書き方は、2026年の制度での減り方と並べる書き方にしました。まだ計算できない案の理由も、どの案も「まだ示されていません」と同じ書き方にしました（連合案だけ「公表していません」としていました）。
    en: Corrected the first paragraph on Home and in the report. It said "Each plan says it aims to lighten the burden on people in work on low (or middle) incomes, but depending on the household, take-home pay can go up or down", which read as if take-home pay could fall under the plans that can't be calculated. It now says separately that each plan states its own aims, and that under the one plan that can be calculated some households gain and some lose. In the report's main finding, the Daiwa plan sentence ("still falls … (the wall remains)") now sets the drop next to the drop under 2026 rules. The reasons why plans can't be calculated now use the same words for every plan (only Rengo's said "hasn't published").
  why:
    ja: 計算できない案について、手取りが減るとする根拠はありません。「でも」「壁は残ります」は、大和総研案がなくすとは言っていない壁について、案を低く見せる書き方でした。
    en: Nothing shows a loss under the plans that can't be calculated. "Still" and "the wall remains" judged the Daiwa plan against removing a wall it never claimed to remove.
- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: 「全世帯で見ると」とレポートで、手取りが平均で増えるグループの説明に、グループ4では7%の世帯で手取りが減ることを書き加えました。「自分で案を作る」の国全体の金額も0.1兆円単位にしました。
    en: On All households and in the report, the sentence on the groups whose take-home pay rises on average now adds that 7% of households in group 4 are worse off. The national total on Build your own is now shown to ¥0.1 trillion as well.
  why:
    ja: 増える世帯と変わらない世帯の割合だけを書いていたため、これらのグループでは減る世帯がないように読めました。
    en: Giving only the shares that gain or see no change made it look as if nobody in those groups loses.
- date: 2026-11-03
  previous: 1204115
  published: 2f1f1c5
  what:
    ja: 「検証」と「計算方法」のページの記述を直しました。総務省の資料３（18ページ）の図を「法律と食い違う」としていましたが、図は100円未満を切り捨てる前の額（4,200円）で、法律と合っています。住民税の令和9年度の条件の修正について、手計算を先に直しテストが失敗するのを確かめたと書いていましたが、そのときは確かめていませんでした（いまは勤労学生の89万円に手計算とテストがあります）。民間給与実態統計調査の人数9か所を、男女を足した数から表の「計」の数に直しました（それぞれ1人の差）。65歳以上の人数の出典名、勤労学生の89万円の根拠（所得税法）、大和総研案で国民健康保険料を数える条件、消費税が入る案（つなぎの案と連合案）、最初に表示する言語の説明、「東京以外では」を「新宿区以外では」とする場所の説明も直しました。
    en: Corrected statements on the Checks and How it works pages. The Checks page called a figure in the Ministry of Internal Affairs' material 3 (page 18) a conflict with the law; the figure shows the amount before rounding to ¥100 (¥4,200) and agrees with the law. It said that for the fiscal 2027 resident-tax limits the hand calculation was corrected first and the test seen failing; that wasn't so at the time (the ¥890,000 working-student limit now has a hand calculation and a test). Nine counts from the National Tax Agency's wage survey were men plus women instead of the table's own totals (1 person off each). We also corrected the source named for people aged 65+, the basis of the ¥890,000 working-student limit (the Income Tax Act), when household NHI counts toward the Daiwa cash cap, which plans include consumption tax (the bridge plan and Rengo), how the first language is chosen, and the note on place ("outside Shinjuku", not "outside Tokyo").
  why:
    ja: 図は所得割を切り捨てる前の連続した線で描いていました。ほかは、手で書いた説明が計算や出典と合っていませんでした。
    en: The figure draws the income levy before rounding, as a continuous line. The rest were hand-written statements that didn't match the calculation or the sources.
- date: 2026-11-03
  previous: 4e1c6be
  published: 1204115
  what:
    ja: 住民税の100円未満の切り捨てを、特別区民税と都民税のそれぞれで行うように直しました。例の世帯H3、H5、H8の手取りが年100円増え、いくつかの壁の金額が100円変わりました。「（近似）住民税では、課税される所得の1,000円未満と、税額の100円未満を切り捨てています。一般的に使われている方法ですが、法律の条文ではまだ確認していません」という注意書きは、法律で確かめたため外しました。
    en: Resident tax is now rounded down to the nearest ¥100 separately for the ward tax and the Tokyo tax. Take-home pay for example households H3, H5 and H8 goes up by ¥100 a year, and some walls change by ¥100. The note "(Approximation) For resident tax, we round taxable income down to the nearest ¥1,000 and the tax down to the nearest ¥100. This is the common practice, but we haven't yet checked it against the text of the law" is gone, because the rule is now checked against the law.
  why:
    ja: 地方税法20条の4の2第3項では、税ごとに100円未満を切り捨てます。以前は、二つの税を合わせた10%を一度に切り捨てていました。大田区の計算例も税ごとに切り捨てています。
    en: Under the Local Tax Act (article 20-4-2, paragraph 3), each tax is rounded down to ¥100 on its own. We used to round the combined 10% once. Ota City's worked example also rounds each tax.
