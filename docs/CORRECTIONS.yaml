  what:
    ja: 連合案をまだ計算できない理由を、「連合の案の資料をまだ入手できていません」から「連合が消費税還付制度の金額をまだ公表していません」に直しました。
    en: Changed the reason the Rengo plan can't be calculated yet, from "we haven't been able to get Rengo's proposal documents" to "Rengo hasn't published the amounts for its consumption tax refund".
  why:
    ja: 連合のウェブサイトの別のページで資料が見つかりました。資料には、案の一部である消費税還付制度の金額が書かれていないため、案はまだ計算できません。
    en: We found the documents on other pages of Rengo's website. They give no amounts for the consumption tax refund, which is part of the plan, so the plan still can't be calculated.
