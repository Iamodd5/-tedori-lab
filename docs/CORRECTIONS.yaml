    - label: {ja: 2026年の制度：元の手取りに戻る配偶者の年収（円）, en: "2026 rules: spouse's pay needed to get back to the same take-home pay (yen)"}
      before: 1650000
      after: 1640000
      check: {household: H4, design: baseline, from: 1290000, field: back}
    - label: {ja: 大和総研案：手取りの減少（円／年）, en: "Daiwa Institute plan: drop in take-home pay (yen a year)"}
      before: 240126
      after: 217926
      check: {household: H4, design: daiwa, from: 1290000, field: drop}
    - label: {ja: 大和総研案：元の手取りに戻る配偶者の年収（円）, en: "Daiwa Institute plan: spouse's pay needed to get back to the same take-home pay (yen)"}
      before: 1620000
      after: 1600000
      check: {household: H4, design: daiwa, from: 1290000, field: back}
    - label: {ja: （近似）全世帯・大和総研案：年収の低い方から2番目のグループの手取りの平均の変化（円／年）, en: "(Approximation) All households, Daiwa Institute plan: average change in take-home pay, 2nd income group from the bottom (yen a year)"}
      before: 6490
