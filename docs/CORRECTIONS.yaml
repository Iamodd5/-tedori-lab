  previous: 4e1c6be
  published: 1204115
  what:
    ja: 「計算方法」のページに「ページに直接書いた数字はない」とありましたが、「検証」ページには手で書いた数字がありました。そう分かるように直し、そのうち3節と10節の数字を出力ファイルと比べるテストを加えました（ほかの節は手で直しています）。
    en: The How it works page said no number is typed into a page, but the Checks page had hand-written numbers. It now says so, and a test compares the numbers in its sections 3 and 10 with the output files (the other sections are kept up to date by hand).
  why:
