- date: 2026-11-03
  previous: 4e1c6be
  what:
    ja: 国民健康保険料の軽減で、世帯の「給与所得者等」に数える人を、政令のとおりにしました（給与収入55万円超、または年金収入60万円超、65歳以上は125万円超）。例の世帯H6（年金生活の夫婦）の壁が、10万円低い年金の位置に移りました。今の収入での手取りは変わりません。
    en: For the National Health Insurance reduction, who counts as an earner in the household now follows the Cabinet order (salary over ¥550,000, or a pension over ¥600,000, or over ¥1.25m at 65 or over). Example household H6's (a pensioner couple) walls move to pensions ¥100,000 lower. Take-home pay at their current income doesn't change.
  why:
    ja: 以前は、収入が少しでもある人をすべて数えていました。国民健康保険法施行令29条の7第6項第1号と附則5条では、年金80万円の配偶者（72歳）は数えません。（模擬の閲覧者によるレビューで指摘）
    en: We used to count everyone with any income. Under the National Health Insurance Act Enforcement Order (article 29-7, paragraph 6, item 1, and supplementary article 5), the 72-year-old spouse with a ¥800,000 pension does not count. (Found by the simulated-visitor review.)
  numbers:
