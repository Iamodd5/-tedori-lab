# Population view (SPEC 9.3, 9.4). Data chosen by the human: HUMAN_TODO H-17 (option A, docs/M7_DATA_OPTIONS.md).
# scripts/extract_population.py turns the sources below into cells.csv, food.csv and checks.csv;
# engine/population.py builds one model household per group and income band from them.
# Everything in `assumptions` is a modelling choice, not a policy number: each is approximation: true and is
# shown wherever population numbers appear (CLAUDE.md rule 3).

sources:
  zkk_income:
    file: stats/zkk2024_shotoku_3-32-1.xlsx
    title: 令和6年全国家計構造調査 所得に関する結果 第3-32-1表 年間収入階級，世帯類型，所得構成別1世帯当たり年間収入額－全国
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040482919&fileKind=0
    publisher: 総務省統計局
    published: 2026-08-28
  zkk_spending:
    file: stats/zkk2024_kakei_1-21.xlsx
    title: 令和6年全国家計構造調査 家計収支に関する結果 第1-21表 世帯の種類，世帯区分，世帯主の性別，年間収入階級・十分位階級・五分位階級，収支項目分類別1世帯当たり1か月間の収入と支出－全国
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040379252&fileKind=0
    publisher: 総務省統計局
    published: 2025-12-19
  kakei_2025:
    file: stats/kakei2025_sosetai_3.xlsx
    title: 家計調査（家計収支編）2025年 総世帯 第3表 年間収入五分位・十分位階級別1世帯当たり1か月間の収入と支出
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040409804&fileKind=0
    publisher: 総務省統計局
    published: 2026-02-06
  kiso_2025:
    file: stats/kiso2025_setai_2.csv
    title: 2025年国民生活基礎調査 世帯票 第2表 世帯数－構成割合，世帯構造・年次別
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040472271&fileKind=1
    publisher: 厚生労働省
    published: 2026-07-15
  minkan_r7:
    file: stats/minkan_r7_3.xlsx
    title: 令和7年分民間給与実態統計調査 第3表 給与階級別の総括表 その1（1年を通じて勤務した給与所得者）
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040505068&fileKind=0
    publisher: 国税庁
    published: 2026-09-29

# The groups split 総世帯 into parts that do not overlap. `columns` are the table's 世帯類型 codes;
# a leading "-" subtracts a column (the "other" group is what is left of 二人以上の世帯).
groups:
  single:          {ja: 単身世帯, en: Single person, columns: ["2"], spouse: false, children: 0}
  couple:          {ja: 夫婦のみ, en: Couple only, columns: ["111"], spouse: true, children: 0}
  couple_1child:   {ja: 夫婦と子1人, en: Couple and one child, columns: ["112"], spouse: true, children: 1}
  couple_2children: {ja: 夫婦と子2人, en: Couple and two children, columns: ["113"], spouse: true, children: 2}
  couple_3children: {ja: 夫婦と子3人以上, en: Couple and three or more children, columns: ["115"], spouse: true, children: 3}
  lone_parent:     {ja: ひとり親と子, en: Lone parent and children, columns: ["117"], spouse: false, children: from_size}
  with_parents:    {ja: 夫婦と親（子のいる世帯を含む）, en: Couple living with parents (with or without children), columns: ["12", "13"], spouse: true, children: under18_only, relatives: true}
  other:           {ja: その他の二人以上の世帯, en: Other households of two or more, columns: ["1", "-11", "-12", "-13"], spouse: false, children: under18_only, relatives: true}

assumptions:
  one_household_per_cell:
    approximation: true
    ja: 調査は世帯一つひとつのデータではなく、「世帯の種類 × 年収50万円刻み」ごとの平均だけを公表しています。そこで、それぞれの組み合わせを2〜3通りの典型的な世帯で代表させています。同じ組み合わせの中での世帯ごとの違いは反映されません。
    en: The survey doesn't publish data on individual households, only averages for each type of household in each ¥500,000 income range. So each of these groups is represented by two or three typical households. Differences between households in the same group are lost.
  income_split:
    approximation: true
    ja: それぞれの組み合わせを「年金で暮らす世帯」と「働いて暮らす世帯」に分けています。分ける割合は、その組み合わせの収入のうち年金が占める割合です。年金をもらいながら働く世帯（働く高齢者など）は表れません。
    en: Each group is split into households living on pensions and households living on work, in the same ratio as pensions to total income in that group. Households with both a pension and a wage, such as older people who still work, don't appear.
  spouse_earnings:
    approximation: true
    ja: 働いて暮らす夫婦は、調査の「働いている人の数」をもとに、共働きと片働きに分けています。
    en: Working couples are split into two-earner and one-earner households, based on how many people work in each household according to the survey.
  older_age:
    value: 70
    approximation: true
    ja: 年金で暮らす人は全員70歳として計算しています（75歳以上の人の医療保険の仕組みは入っていません）。
    en: Everyone living on a pension is treated as age 70. The separate health insurance for people 75 and over is not included.
  child_age:
    value: 10
    approximation: true
    ja: 18歳未満の子どもは全員10歳としています。働いている大人の年齢は、調査の平均年齢から決めています（20〜64歳）。
    en: All children under 18 are treated as age 10. Working adults get an age based on the survey's average for their group (between 20 and 64).
  adult_child_age:
    value: 22
    approximation: true
    ja: 18歳以上の子どもは22歳とし、調査の「その他の家族の収入」を均等に分けています。
    en: Children aged 18 and over are treated as age 22 and share the survey's "other family members' earnings" equally.
  work:
    approximation: true
    ja: 給料をもらう人は全員、週20時間以上・従業員51人以上の会社で働いているとしています。そのため月8.8万円以上稼ぐと、会社の健康保険と厚生年金に入ります。
    en: Everyone with a wage is treated as working 20+ hours a week at a company with more than 50 employees, so they join the company's health insurance and pension once they earn ¥88,000 a month.
  income_sources:
    approximation: true
    ja: 計算に入れている収入は、給料・事業の収入・年金だけです。家賃収入、利子・配当、仕送りなどは入っていません。事業の収入は経費を引いた後の額として扱っています。
    en: Only wages, business income and pensions are counted. Rent, interest, dividends and money from family are left out. Business income is treated as profit after costs.
  food_spending:
    approximation: true
    ja: 食料品の支出は、似た種類・同じ年収の世帯の平均（2024年10〜11月の調査）を使っています。季節による違いは調整していません。
    en: Food spending is the average for similar households with the same income, from a survey taken in October–November 2024. It isn't adjusted for the time of year.
  elderly_dependants:  # OPEN_QUESTIONS Q32
    approximation: true
    ja: 70歳以上の親などを養っていても、税金が通常より安くなる特別な控除（老人扶養親族）は入れず、通常の扶養の控除で計算しています。
    en: If a household supports a parent or relative aged 70 or over, we use the normal tax break for dependants, not the larger one for older dependants.
  survey_year:
    approximation: true
    ja: 世帯の数と収入は2024年の調査の数字のままで、2026年向けに調整していません。
    en: Household numbers and incomes are from 2024 and haven't been updated to 2026.
