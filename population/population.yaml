    title: 家計調査（家計収支編）2025年 総世帯 第3表 年間収入五分位・十分位階級別1世帯当たり1か月間の収入と支出
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040409804&fileKind=0
