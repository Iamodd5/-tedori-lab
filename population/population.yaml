    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040482919&fileKind=0
    publisher: 総務省統計局
    published: 2026-08-28
  zkk_spending:
    file: stats/zkk2024_kakei_1-21.xlsx
    title: 令和6年全国家計構造調査 家計収支に関する結果 第1-21表 世帯の種類，世帯区分，世帯主の性別，年間収入階級・十分位階級・五分位階級，収支項目分類別1世帯当たり1か月間の収入と支出－全国
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040379252&fileKind=0
    publisher: 総務省統計局
    published: 2025-12-19
  kakei_2025:
